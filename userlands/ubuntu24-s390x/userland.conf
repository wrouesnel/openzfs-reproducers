# Userland ubuntu24-s390x: the big-endian root file system (Ubuntu 24.04 for
# IBM Z; the same packages as ubuntu24, from the ports archive) for the
# s390x targets, and the builder of their OpenZFS userland tools.  It is
# built under qemu-user (binfmt_misc with the F flag, e.g. Ubuntu's
# qemu-user-static).  Read by builder/ (shell-style KEY=VALUE).
ARCH=s390x
FAMILY=ubuntu
# the s390x image of the same Ubuntu 24.04 index as ubuntu24 (sha256:534baea6...)
IMAGE='docker.io/library/ubuntu:24.04@sha256:ed9fb832733ac3e7ca6f8bb29c369763f7f25ebff65b555990cbb88636320501'
SNAPSHOT='20261015T000000Z'
