# Userland ubuntu24-ext: the extended root file system for reproducers whose
# tests need tools the minimal ubuntu24 root lacks (BASE='ext' in
# reproducer.conf; docs/reproducer-format.md).  It is ubuntu24's root as
# built (PARENT), plus the files of EXT_PKGS from the same Ubuntu snapshot,
# the libraries they need, fio (builder/in/fio.sh) and real udev, started
# by /etc/rcS.  No compilers.  Built by builder/in/userland-ext.sh in the
# parent's builder; the targets' extended kernel layers (kernel-ext.sh) add
# their full module trees on top of it.
PARENT=ubuntu24
ARCH=x86_64
FAMILY=ubuntu
EXT_PKGS='valgrind libc6-dbg
	udev kmod
	gdb libpython3.12t64 strace ltrace
	python3 python3-minimal python3.12 python3.12-minimal libpython3.12-minimal libpython3.12-stdlib
	sg3-utils lsscsi parted gdisk fdisk util-linux e2fsprogs dmsetup
	tar attr acl xxd procps psmisc lsof jq xxhash file bc netbase'
