# Userland ubuntu24-uutils: ubuntu24's root as built (PARENT), with the
# coreutils programs named in UUTILS replaced by uutils coreutils (the Rust
# coreutils), at the version Ubuntu 26.04 ships as rust-coreutils (0.8.0).
# For reproducers whose bug shows only with that implementation of a tool
# (BASE='uutils' in reproducer.conf; docs/reproducer-format.md, "Tool
# variants").  Built by builder/in/userland-uutils.sh in the parent's
# builder.  Ubuntu 26.04's own package needs glibc 2.43 (this root has
# 2.39), so it is upstream's static (musl) release build of the same
# version, pinned by its sha256.
PARENT=ubuntu24
ARCH=x86_64
FAMILY=ubuntu
UUTILS_VERSION='0.8.0'
UUTILS_URL='https://github.com/uutils/coreutils/releases/download/0.8.0/coreutils-0.8.0-x86_64-unknown-linux-musl.tar.gz'
UUTILS_SHA256='b8977997a49b677169f7ce65bfc2ad658d4943c4f02f0493b1a802137202b0bf'
# the programs that become uutils' (links to its multi-call binary); the
# rest stay GNU or busybox, as in ubuntu24
UUTILS='mkdir'
