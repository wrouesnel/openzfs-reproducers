# Reproducer tuxoko/recv-blksz-ctl (docs/reproducer-format.md): a control
# pair for openzfs/zfs#18663, kept apart from tuxoko/recv-blksz.  It runs the
# same demo with the embed4m case (a 4M file, beyond the PR's old 16-block
# lookahead limit, gzip-9, 64K of a compressible pattern, every send -e: the
# forward stream carries WRITE_EMBEDDED lsize=64K for a 128K-block object).
# repro = the PR before its commit 088fb7e3d3 ("Fix WRITE_EMBEDDED for files
# with different blksz in src and tgt"): a6fad8b463, pinned, because it is a
# superseded state of the branch that must not move; fixed = the PR head.
TITLE='zfs recv -e: WRITE_EMBEDDED with lsize below the kept block size panics (debug) / corrupts (release) with #18663 before 088fb7e3d3'
REPO='https://github.com/tuxoko/zfs'
BRANCH='recv_blksz'
AUTHOR='@tuxoko'
REPORTER='@tigerblue77 (review on openzfs/zfs#18663)'
PRS='18663'
ISSUES=''
BUILD_repro='https://github.com/tuxoko/zfs@a6fad8b4638370dd4b9265a442707747895e6ef8'
BUILD_fixed='https://github.com/tuxoko/zfs@recv_blksz'
CONFIGURE='--enable-debug'
EXPECT_repro='RESULT BUG: kernel assertion in zfs recv (embed4m)'
EXPECT_fixed='RESULT OK: every forward receive succeeded and fs1 matches fs0 (embed4m)'
# CASES: which cases the demo runs (demo.sh header; default here "embed4m")
PASS_ENV='CASES'
EXTRACT='demo.sh'
# VM defaults
MEM=2048
CPUS=2
TIMEOUT=600
DISKS=1
DISK_SIZE=2G
