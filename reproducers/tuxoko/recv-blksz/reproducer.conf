# Reproducer tuxoko/recv-blksz (docs/reproducer-format.md)
TITLE='zfs recv silently loses a file, or fails with EINVAL, after a reverse incremental between datasets with different recordsize'
REPO='https://github.com/tuxoko/zfs'
BRANCH='recv_blksz'
AUTHOR='@tuxoko'
REPORTER='@tuxoko (openzfs/zfs#18663)'
PRS='18663'
ISSUES=''
# repro = the openzfs/zfs master commit the PR is based on (the demo is
# ours, so the break needs no test commit); fixed = the PR head
BUILD_repro='https://github.com/openzfs/zfs@merge-base(recv_blksz)'
BUILD_fixed='https://github.com/tuxoko/zfs@recv_blksz'
CONFIGURE='--enable-debug'
EXPECT_repro='RESULT BUG: silent data loss'
EXPECT_fixed='RESULT OK: every forward receive succeeded and fs1 matches fs0'
# CASES: which cases the demo runs (demo.sh header; default "prbody2 chmod")
PASS_ENV='CASES'
EXTRACT='demo.sh'
# VM defaults
MEM=2048
CPUS=2
TIMEOUT=600
DISKS=1
DISK_SIZE=2G
