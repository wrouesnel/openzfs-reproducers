# Reproducer kcid9660/posixacl-create-mode (docs/reproducer-format.md)
# openzfs/zfs#19958 (@kcid9660): with acltype=posix the umask or a parent's
# default ACL sets a new file's mode in zpl_init_acl() without a ZIL record,
# so ZIL replay recreates the requested mode (an fsynced 0644 file comes
# back 0666, a 0755 directory 0777).  #19959 settles the mode before the
# inode is created.  The demo is the reporter's zpool-freeze script
# (xattr=sa and xattr=dir, acltype=off control); its RESULT is about the
# create modes only (focus).  The setfacl mode, #19960's half
# (kcid9660/posixacl-setfacl-mode, the same demo), is reported on its own line.
TITLE='acltype=posix: the mode set at create by the umask or a default ACL is lost on ZIL replay'
REPO='https://github.com/kcid9660/zfs'
BRANCH='posixacl-create-mode'
AUTHOR='@kcid9660'
REPORTER='@kcid9660 (#19958)'
PRS='19959'
ISSUES='19958'
# repro = the openzfs/zfs master commit the PR is based on; fixed = the PR head
BUILD_repro='https://github.com/openzfs/zfs@merge-base(posixacl-create-mode)'
BUILD_fixed='https://github.com/kcid9660/zfs@posixacl-create-mode'
CONFIGURE='--enable-debug'
EXTRA_PKGS='acl'
EXPECT_repro='RESULT BUG: acltype=posix: modes set at create'
EXPECT_fixed='RESULT OK: acltype=posix: modes set at create'
MEM=2048
CPUS=2
TIMEOUT=600
DISKS=1
DISK_SIZE=1G
