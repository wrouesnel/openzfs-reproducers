# Reproducer kcid9660/posixacl-setfacl-mode (docs/reproducer-format.md)
# openzfs/zfs#19958 (@kcid9660): with acltype=posix, setfacl changes an
# existing file's mode in zpl_set_posix_acl() without a ZIL record, so ZIL
# replay brings back the ACL but the old mode (setfacl to 0640 comes back
# 0644).  #19960 logs that mode change as TX_SETATTR.  The demo is the
# reporter's zpool-freeze script (xattr=sa and xattr=dir, acltype=off
# control); its RESULT is about the setfacl mode only (focus).  The create
# modes, #19959's half (kcid9660/posixacl-create-mode, the same demo), are
# reported on their own line.
TITLE='acltype=posix: the mode setfacl sets on an existing file is lost on ZIL replay'
REPO='https://github.com/kcid9660/zfs'
BRANCH='posixacl-setfacl-mode'
AUTHOR='@kcid9660'
REPORTER='@kcid9660 (#19958)'
PRS='19960'
ISSUES='19958'
# repro = the openzfs/zfs master commit the PR is based on; fixed = the PR head
BUILD_repro='https://github.com/openzfs/zfs@merge-base(posixacl-setfacl-mode)'
BUILD_fixed='https://github.com/kcid9660/zfs@posixacl-setfacl-mode'
CONFIGURE='--enable-debug'
EXTRA_PKGS='acl'
EXPECT_repro='RESULT BUG: acltype=posix: the mode setfacl sets'
EXPECT_fixed='RESULT OK: acltype=posix: the mode setfacl sets'
MEM=2048
CPUS=2
TIMEOUT=600
DISKS=1
DISK_SIZE=1G
