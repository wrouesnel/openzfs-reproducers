# Reproducer rcmcdonald91/update-pages-len (docs/reproducer-format.md)
# openzfs/zfs#20015: zfs_clone_range() refreshes the destination's cached
# pages with update_pages() after each chunk it clones, and update_pages()
# takes the length as an int.  With recordsize=4M a chunk can be 2 GiB or
# more, and such a length comes out zero or negative, so no cached page is
# refreshed and read(2) through the cached pages returns the old data.  The
# PR takes the length as uint64_t.  The PR's own test, on both builds
# (ZTS_SCRIPTS=fixed): it caches the destination's pages (single thread,
# settled before the clone), clones 513 x 4 MiB records over it, and reads
# the first record back.
TITLE='A block clone of 2 GiB or more in one chunk leaves the destination file'"'"'s cached pages holding the old data (update_pages() length truncated to int)'
REPO='https://github.com/rcmcdonald91/zfs'
BRANCH='update-pages-len'
AUTHOR='@rcmcdonald91'
REPORTER='@rcmcdonald91'
PRS='20015'
ISSUES=''
# repro = the openzfs/zfs master commit the PR is based on; fixed = the PR head
BUILD_repro='https://github.com/openzfs/zfs@merge-base(update-pages-len)'
BUILD_fixed='https://github.com/rcmcdonald91/zfs@update-pages-len'
CONFIGURE='--enable-debug'
# KIND=zts: the PR's test (the fix head's scripts) on both builds
KIND='zts'
ZTS_SCRIPTS='fixed'
ZTS_TESTS='tests/functional/block_cloning/block_cloning_clone_mmap_cached_large'
TOOLS='append_only_ops clone_after_trunc clone_mmap_cached clone_mmap_write clonefile ctime draid file_write getversion mkfile mmap_stale_check'
EXPECT_repro='RESULT BUG'
EXPECT_fixed='RESULT OK'
ZTS_NOTE_repro='The repro build has no fix: after the clone, cmp finds the destination'"'"'s first record (read through its cached pages) still holds the old data, not the cloned data.'
ZTS_NOTE_fixed='With the PR the cached pages are refreshed: the destination'"'"'s first record reads back as the cloned data, and zdb shows the record was cloned, not copied.'
MEM=2048
CPUS=2
TIMEOUT=1800
DISKS=1
DISK_SIZE=16G
