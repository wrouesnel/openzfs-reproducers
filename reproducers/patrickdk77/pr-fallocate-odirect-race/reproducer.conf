# Reproducer patrickdk77/pr-fallocate-odirect-race (docs/reproducer-format.md); scaffolded by scripts/new-reproducer.sh
TITLE='Linux: fallocate(2) truncates a concurrent extending O_DIRECT or buffered write'
REPO='https://github.com/patrickdk77/zfs'
BRANCH='pr/fallocate-odirect-race'
AUTHOR='@patrickdk77'
REPORTER='openzfs/zfs#11797'
PRS='19344'
ISSUES='11797'
# repro = the PR's two test commits without the fix: zts-pr19344-repro on
# wrouesnel/zfs is commits 1 and 3 of the PR cherry-picked onto its
# merge base with master (the fix is commit 2, so BRANCH~N can't express it);
# fixed = the PR head
BUILD_repro='https://github.com/wrouesnel/zfs@zts-pr19344-repro'
BUILD_fixed='https://github.com/patrickdk77/zfs@pr/fallocate-odirect-race'
CONFIGURE='--enable-debug'
# KIND=zts: the demo runs these ZTS tests, from each build's own commit
KIND='zts'
ZTS_TESTS='tests/functional/fallocate/fallocate_odirect_append'
TOOLS='ctime dio_append_fallocate draid file_write getversion mkfile'
EXPECT_repro='RESULT BUG: ZTS failed: fallocate_odirect_append'
EXPECT_fixed='RESULT OK: ZTS passed: fallocate_odirect_append'
ZTS_NOTE_repro='The bug: fallocate (extend, punch and zero) racing an appending write cuts the file back below the append, so rounds lose the appended block. Each "rounds lost the appended block" line above counts them per mode, O_DIRECT (100 rounds) and buffered (-b, 1000 rounds); the test fails when any round is lost.'
ZTS_NOTE_fixed='The fix: no round lost. Every "0 of N rounds lost the appended block" line above, for extend, punch and zero, with O_DIRECT (100 rounds) and buffered (-b, 1000 rounds) appends.'
MEM=2048
CPUS=4
TIMEOUT=1800
DISKS=1
DISK_SIZE=16G
