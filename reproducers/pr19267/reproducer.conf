# Reproducer pr19267: shell-style KEY=VALUE, read by builder/ and the image.
TITLE='Linux: data stored through mmap past EOF becomes file data when the file is extended'
# upstream references (all public)
PRS='19267'
ISSUES='19220'
# the base system (bases/<BASE>/base.conf)
BASE='linux-ubuntu24'
# builds: LABEL=REPO@SHA, built with CONFIGURE.  bug = the PR's test commit
# (no fix), fix = the PR's head.  Both are reachable from the PR's head on
# github.com/openzfs/zfs (refs/pull/19267/head) and from the branch
# fix-mmap-eof-extend on github.com/wrouesnel/zfs.
BUILDS='bug fix'
BUILD_bug='https://github.com/openzfs/zfs@c8b07a06fa77fcc4527c202cbd04479e8f938f43'
BUILD_fix='https://github.com/openzfs/zfs@f1894abf56a6da2935343662fc4fa39e1e49097f'
BRANCH='https://github.com/wrouesnel/zfs/tree/fix-mmap-eof-extend'
CONFIGURE='--enable-debug'
# what each build's demo prints (prefix of the RESULT line), and inspect.sh on its run disk
EXPECT_bug='RESULT BUG: data stored past EOF through mmap became file data'
EXPECT_fix='RESULT OK: the extended range reads as zeros'
EXPECT_INSPECT_bug='RESULT BUG on disk: 4/4 files hold STALE-DATA past the old EOF'
EXPECT_INSPECT_fix='RESULT OK on disk: 4/4 files read zeros past the old EOF'
# VM defaults
MEM=768
CPUS=2
TIMEOUT=120
DISKS=1
DISK_SIZE=1G
