# Reproducer ooonea/fix-zvol-replay-callback-20261111 (docs/reproducer-format.md); scaffolded by scripts/new-reproducer.sh
# openzfs/zfs#19847: creating a zvol minor opens its ZIL with zvol_get_data
# for replay and, when the replay is empty, skips zil_close().  If something
# else (here a zfs send blocked on a pipe) keeps the snapshot held, its objset
# stays cached, and the next minor's zil_open() finds the old callback:
# VERIFY0P(zilog->zl_get_data) in zil_open() <- zvol_os_create_minor <-
# zvol_set_snapdev_cb on a debug build.  The PR opens the replay-only ZIL with
# no callback.  The test is ours (zvol_misc_snapdev_held, from
# wrouesnel/zfs fix-zvol-zil-close-unused), with the PR's handshake and its
# zvol_misc_common.kshlib source line, so blockdev_exists/blockdev_missing and
# udev_cleanup run on the fix.
TITLE='zvol: a held snapshot minor created again trips VERIFY0P(zilog->zl_get_data) in zil_open()'
REPO='https://github.com/ooonea/zfs'
BRANCH='fix/zvol-replay-callback-20261111'
AUTHOR='@ooonea'
REPORTER='@ooonea (Alpine CI log on openzfs/zfs#19675)'
PRS='19847'
ISSUES=''
# repro = the openzfs/zfs master commit the branch is based on; fixed = the branch head
BUILD_repro='https://github.com/openzfs/zfs@merge-base(fix/zvol-replay-callback-20261111)'
BUILD_fixed='https://github.com/ooonea/zfs@fix/zvol-replay-callback-20261111'
CONFIGURE='--enable-debug'
# KIND=zts: the demo runs these ZTS tests, from each build's own commit
KIND='zts'
ZTS_TESTS='tests/functional/zvol/zvol_misc/zvol_misc_snapdev_held'
# the test came with the fix: both builds run the fix head's scripts
ZTS_SCRIPTS='fixed'
TOOLS='draid file_write getversion mkfile'
# the SPL VERIFY leaves the guest running: the runner prints RESULT BUG with
# the kernel's "PANIC at zil.c:NNNN:zil_open()" line (after VERIFY0P(zilog->zl_get_data) failed)
EXPECT_repro='RESULT BUG'
EXPECT_fixed='RESULT OK'
ZTS_NOTE_repro='Master hits VERIFY0P(zilog->zl_get_data) in zil_open() when the held snapshot minor is created the second time (the second zfs set snapdev=visible), so the test never finishes.'
ZTS_NOTE_fixed='With the PR the snapshot minor appears and disappears three times while the send holds it (blockdev_exists/blockdev_missing pass, no "not found" lines, udev_cleanup prunes the links), and the stream then receives.'
MEM=2048
CPUS=2
TIMEOUT=1800
DISKS=1
DISK_SIZE=16G
