# Reproducer andriytk/fix-data-corruption-on-disk-clear-during-rebuild (docs/reproducer-format.md)
# openzfs/zfs#19936: on a dRAID pool, a leaf whose data lives on a distributed
# spare is cleared while another leaf's sequential rebuild runs.  When that
# rebuild finishes, master excises the cleared leaf's DTL as well and detaches
# its spare, although the cleared leaf never got the data written while it
# was out.  If the next disk fails before a scrub, files are lost.
TITLE='dRAID: a disk cleared during a sequential rebuild loses its spare, and data, when the rebuild finishes'
REPO='https://github.com/andriytk/zfs'
BRANCH='fix-data-corruption-on-disk-clear-during-rebuild'
AUTHOR='@andriytk'
REPORTER='@andriytk'
PRS='19936'
ISSUES=''
# repro = the openzfs/zfs master commit the PR is based on; fixed = the PR head
BUILD_repro='https://github.com/openzfs/zfs@merge-base(fix-data-corruption-on-disk-clear-during-rebuild)'
BUILD_fixed='https://github.com/andriytk/zfs@fix-data-corruption-on-disk-clear-during-rebuild'
CONFIGURE='--enable-debug'
# a console demo: draid1:2d:10c:3s, two disks rebuilt onto spares, new data,
# both cleared while a third disk's rebuild is held, then the next disk fails;
# zpool status -v after each step
EXPECT_repro='RESULT BUG: the spares of the cleared disks were detached'
EXPECT_fixed='RESULT OK: the spares stayed in use and every file read back intact'
MEM=2048
CPUS=2
TIMEOUT=900
DISKS=10
DISK_SIZE=512M
