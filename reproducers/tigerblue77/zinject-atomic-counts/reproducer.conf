# Reproducer tigerblue77/zinject-atomic-counts (docs/reproducer-format.md)
# openzfs/zfs#19978: the zinject I/O hooks count matches and injections with
# a plain ++ under inject_lock held as a reader, and the listing copies the
# record under the same reader lock, so counts are lost or read between the
# two increments.  ZTS cli_root/zinject/zinject_counts (which checks the
# counts since #19530) fails on it now and then ("freq=100 match=55
# inject=54"): 1-3 of 40 runs with 8-12 CPUs in our VMs, 0 of 40 with 2.
# The demo is a stress loop of the same kind (3-way mirror, a freq=100 write
# fault on one side, eight writers), which shows it in most runs.
TITLE='zinject: match and injection counts are lost or read half-updated (plain ++ under a reader lock), so zinject_counts flakes'
REPO='https://github.com/tigerblue77/zfs'
BRANCH='zinject-atomic-counts'
AUTHOR='@tigerblue77'
REPORTER='@tigerblue77'
PRS='19978'
ISSUES='19341'
# repro = the openzfs/zfs master commit the PR is based on; fixed = the PR head
BUILD_repro='https://github.com/openzfs/zfs@merge-base(zinject-atomic-counts)'
BUILD_fixed='https://github.com/tigerblue77/zfs@zinject-atomic-counts'
CONFIGURE='--enable-debug'
EXPECT_repro='RESULT BUG: '
EXPECT_fixed='RESULT OK: '
# a race: the break must show it in at least 2 of 3 runs, the fix never
RUNS_repro=3
MIN_MATCH_repro=2
RUNS_fixed=3
# lost updates need hooks running on several CPUs at once
MEM=2048
CPUS=8
TIMEOUT=900
DISKS=1
DISK_SIZE=1G
