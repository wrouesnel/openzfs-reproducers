# Reproducer tigerblue77/rebuild-cancel-state-lock (docs/reproducer-format.md)
# PR #19612: once per metaslab the sequential rebuild (zpool replace -s)
# asks vdev_resilver_needed() whether any leaf still needs it, holding only
# SCL_CONFIG, and cancels itself when none does.  vdev_reopen() (zpool
# reopen, and every zpool scrub, even one that is then refused) closes all
# leaves under SCL_STATE_ALL before reopening them, so a check in that
# window finds the new leaf closed and cancels the rebuild.  Nothing
# restarts it: the replacing vdev stays and `zpool wait` never returns (the
# replacement/scrub_cancel CI hang).  The PR holds SCL_STATE for the check
# (and in the rebuild initiate/reset sync tasks).
# The demo is the PR's ZTS test rebuild_reopen: sequential rebuilds back
# and forth while 4 loops run `zpool scrub` (each refused, but each
# reopens every vdev first); on master a rebuild cancels itself.
# repro = master at the PR's merge base; fixed = the PR head.
TITLE='A sequential rebuild cancels itself when a reopen (a refused zpool scrub, zpool reopen) closes the new leaf'
REPO='https://github.com/tigerblue77/zfs'
BRANCH='rebuild-cancel-state-lock'
AUTHOR='@tigerblue77'
REPORTER=''
PRS='19612'
ISSUES=''
