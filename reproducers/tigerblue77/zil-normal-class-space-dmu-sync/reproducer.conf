# Reproducer tigerblue77/zil-normal-class-space-dmu-sync (docs/reproducer-format.md)
# A companion of tigerblue77/zil-normal-class-space: the second path to
# openzfs/zfs#20004's ENOSPC suspend, which openzfs/zfs#19755 doesn't cover.
# The reporter's 128 MiB mirror with sync=always and four writers, but 64 KiB
# writes, which are logged WR_INDIRECT: each dmu_sync() allocates a new
# override block in open context, and the override it replaces is freed only
# when the txg syncs, so the overrides fill the pool in the open txg.
# zfs_txg_timeout is raised to 30 s (as #19755's enospc_zil does), so only
# the space check ends a txg in the image's slower VM.
# Bug only, on #19755's head. The follow-up fix is on
# wrouesnel/zfs:fix-dmu-sync-override-space.
TITLE='WR_INDIRECT sync overwrites fill a pool with dmu_sync() override blocks and suspend it with ENOSPC, with #19755 applied'
REPO='https://github.com/tigerblue77/zfs'
BRANCH='zil-normal-class-space'
AUTHOR='@tigerblue77'
REPORTER='@johnpwhite'
PRS='19755'
ISSUES='20004'
BUILD_repro='https://github.com/tigerblue77/zfs@zil-normal-class-space'
CONFIGURE='--enable-debug'
EXPECT_repro='RESULT BUG: the pool suspended'
PASS_ENV='WRITE_SECONDS WRITE_BS WRITE_COUNT LOGBIAS TXG_TIMEOUT'
TARGETS='ubuntu24'
MEM=2048
CPUS=4
TIMEOUT=600
DISKS=1
DISK_SIZE=1G
