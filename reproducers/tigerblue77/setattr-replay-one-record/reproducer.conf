# Reproducer tigerblue77/setattr-replay-one-record (docs/reproducer-format.md)
# openzfs/zfs#19985: since #19706 (b306edf42f, master only), replaying a
# TX_SETATTR record that carries ATTR_SIZE (written by Linux before #19706,
# or by FreeBSD) marks the record replayed in zfs_freesp()'s txg and again
# in zfs_setattr()'s; a stop between the two skips the record on the next
# replay (mode, owner and times lost).  A debug build also trips
# VERIFY(zh->zh_replay_seq < *replayed_seq) in zil_sync() when the two fall
# in different txgs.
# The demo needs (payload.sh): a module from before #19706 to write the log
# (master can't), and, in both images, the image's own commit with the same
# test-only hook that pauses the replay right after the size change synced
# (inert at 0), so that the disk can be copied where a power cut would
# leave it.  Then a power cut, and the check on the image's own build.
TITLE='ZIL replay of a TX_SETATTR with a size change marks the record replayed twice: a stop in between loses its mode, owner and times'
REPO='https://github.com/tigerblue77/zfs'
BRANCH='setattr-replay-one-record'
AUTHOR='@tigerblue77'
REPORTER='@tigerblue77'
PRS='19985'
ISSUES=''
# repro = the openzfs/zfs master commit the PR is based on; fixed = the PR head
BUILD_repro='https://github.com/openzfs/zfs@merge-base(setattr-replay-one-record)'
BUILD_fixed='https://github.com/tigerblue77/zfs@setattr-replay-one-record'
CONFIGURE='--enable-debug'
EXPECT_repro='RESULT BUG: '
EXPECT_fixed='RESULT OK: '
# the payload builds three sets of modules per target: ubuntu24 only for now
TARGETS='ubuntu24'
MEM=2048
CPUS=2
TIMEOUT=900
DISKS=1
DISK_SIZE=2G
