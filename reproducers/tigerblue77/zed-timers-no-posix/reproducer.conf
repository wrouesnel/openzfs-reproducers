# Reproducer tigerblue77/zed-timers-no-posix (docs/reproducer-format.md)
# openzfs/zfs#19954: the PR carries #19629's three commits (the FMD timer
# use-after-free, reproducer tigerblue77/zed-timer-uaf) and adds 5d719f0fe3,
# the commit under review: FMD timers become deadlines that ZED's agents
# thread waits for, instead of SIGEV_THREAD POSIX timers.  The PR's own test
# is a unit test (tests/unit/test_fmd_timer), not a ZTS test, so the demo
# shows the behaviour that commit changes: when timer_create() fails
# (RLIMIT_SIGPENDING reached), master's ZED never solves an I/O error case,
# so a vdev returning read errors is never FAULTED; with the PR it is, 15 s
# after the errors, as with the usual limits (the demo's control).
# Checked once (2026-11-22, not kept as a reproducer) with the PR's HEAD~1
# (#19629 alone, 92f868050b) as the break: also RESULT BUG, with ZED logging
# "failed to create timer: Resource temporarily unavailable", so it is
# 5d719f0fe3 that makes the timer fire.
TITLE='ZED: when timer_create() fails (RLIMIT_SIGPENDING), FMD timers never fire and a vdev with I/O errors is never FAULTED'
REPO='https://github.com/tigerblue77/zfs'
BRANCH='zed-timers-no-posix'
AUTHOR='@tigerblue77'
REPORTER='@tigerblue77'
PRS='19954'
ISSUES='19569'
# repro = the openzfs/zfs master commit the PR is based on; fixed = the PR head
BUILD_repro='https://github.com/openzfs/zfs@merge-base(zed-timers-no-posix)'
BUILD_fixed='https://github.com/tigerblue77/zfs@zed-timers-no-posix'
CONFIGURE='--enable-debug'
TOOLS='zed'
EXPECT_repro='RESULT BUG: with RLIMIT_SIGPENDING 0'
EXPECT_fixed='RESULT OK: with RLIMIT_SIGPENDING 0'
# VM defaults
MEM=1536
CPUS=2
TIMEOUT=400
DISKS=3
DISK_SIZE=256M
