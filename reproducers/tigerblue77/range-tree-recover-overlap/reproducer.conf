# Reproducer tigerblue77/range-tree-recover-overlap (docs/reproducer-format.md)
# openzfs/zfs#19977: with zfs_recover=1, a space map ALLOC entry that is only
# partly in ms_allocatable is skipped (since #18255, 6495dafd58), so its free
# part stays allocatable and new writes land on live data; and zdb -AA aborts
# on overlapping entries (libzpool's zfs_panic_recover ignores zfs_recover
# since #18133).  The PR's own tests, on both builds (ZTS_SCRIPTS=fixed).
# Both tests write the damaged space map with `zhack metaslab append`, which
# the PR adds (its commit "zhack: add metaslab append", cmd/zhack.c only).
# The repro build (the PR's base) has no such zhack: prep.sh builds the
# repro commit's zhack with the PR's cmd/zhack.c, and /demo/bin/zhack runs it
# only where the build's own zhack lacks `metaslab append` (the repro image).
# Kernel, libzpool and zdb are always the image's own build.
TITLE='zfs_recover hands out the free part of a partly free space map allocation (live data overwritten); zdb -AA aborts on overlaps'
REPO='https://github.com/tigerblue77/zfs'
BRANCH='range-tree-recover-overlap'
AUTHOR='@tigerblue77'
REPORTER='@tigerblue77'
PRS='19977'
ISSUES=''
# repro = the openzfs/zfs master commit the PR is based on; fixed = the PR head
BUILD_repro='https://github.com/openzfs/zfs@merge-base(range-tree-recover-overlap)'
BUILD_fixed='https://github.com/tigerblue77/zfs@range-tree-recover-overlap'
CONFIGURE='--enable-debug'
# KIND=zts: the PR's tests (the fix head's scripts) on both builds
KIND='zts'
ZTS_SCRIPTS='fixed'
ZTS_TESTS='tests/functional/cli_root/zdb/zdb_space_map_overlap tests/functional/cli_root/zhack/zhack_metaslab_append'
EXPECT_repro='RESULT BUG'
EXPECT_fixed='RESULT OK'
ZTS_NOTE_repro='The repro build is a debug build (--enable-debug, as openzfs/zfs CI builds): on it master does not fail zhack_metaslab_append cleanly, it hits an assertion, VERIFY3U(sm_free_space, ==, msp_free_space) / PANIC at metaslab.c metaslab_verify_space() when the metaslab is loaded (or, with ZFS_DEBUG_METASLAB_VERIFY off, VERIFY3U(fill, <=, size) / PANIC at range_tree.c:330 during the scrub), and the runner stops at the kernel line with RESULT BUG. A release build instead writes over the file (CKSUM errors, a permanent error after the scrub). zdb_space_map_overlap fails on master because zdb -AA aborts on the first overlap. The zhack here is the PR one (see /demo/zhack-pr/README).'
ZTS_NOTE_fixed='Both tests use the PR head build: kernel, libzpool, zdb and zhack (its own metaslab append).'
MEM=2048
CPUS=2
TIMEOUT=1800
DISKS=1
DISK_SIZE=16G
