# Reproducer tigerblue77/detach-renamed-import (docs/reproducer-format.md)
# openzfs/zfs#19564 (part of #19559): after a crash between labels 0/2 and
# the uberblocks of the txg of a `zpool detach`, the import scan builds the
# pool's config from labels that no uberblock covers.  From renamed devices,
# a three-way mirror then imports DEGRADED.  The PR (userspace only, libzutil)
# skips those labels.  The crash states are made the way the PR's test makes
# them (label and uberblock-ring regions put back with dd).
TITLE='zpool import: after a crash in the txg of a detach, renamed devices import DEGRADED (the scan uses labels no uberblock covers)'
REPO='https://github.com/tigerblue77/zfs'
BRANCH='detach-renamed-import'
AUTHOR='@tigerblue77'
REPORTER='@tigerblue77'
PRS='19564'
ISSUES='19559'
# repro = the openzfs/zfs master commit the PR is based on; fixed = the PR head
BUILD_repro='https://github.com/openzfs/zfs@merge-base(detach-renamed-import)'
BUILD_fixed='https://github.com/tigerblue77/zfs@detach-renamed-import'
CONFIGURE='--enable-debug'
# a console demo on file vdevs: a control, then three crash states (A decides
# the RESULT; B and C show what the PR alone does not cover, per its own
# table); zpool status -v after each import
EXPECT_repro='RESULT BUG: the renamed three-way mirror imported DEGRADED'
EXPECT_fixed='RESULT OK: the renamed three-way mirror imported ONLINE'
MEM=2048
CPUS=2
TIMEOUT=600
DISKS=1
DISK_SIZE=1G
