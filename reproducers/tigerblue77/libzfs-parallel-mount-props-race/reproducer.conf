# Reproducer tigerblue77/libzfs-parallel-mount-props-race (docs/reproducer-format.md)
# openzfs/zfs#19385: `zpool import -l` (and zfs mount -a) mounts in
# parallel.  zfs_mount_task() reads the mountpoint (zfs_prop_get) of handles
# it has dispatched, while the task mounting one of them refreshes its
# properties (zfs_mount_at -> zfs_refresh_properties -> put_stats_zhdl,
# which nvlist_free()s zhp->zfs_props and stores a new list) with no lock.
# The reader can walk a freed nvlist: aborts in fnvlist_lookup_string() or
# SIGSEGV in libnvpair (seen in fork CI, block_cloning_replay_encrypted).
# The crash itself is rare (0 in 830 import cycles in our VMs), so the demo
# shows the race deterministically: one `zpool import -l` of a pool with 8
# encrypted children (raw keys) under an unencrypted root, under valgrind's
# helgrind (extended base), counting race reports that involve the props
# swap or the mount task's zfs_prop_get.  PR #19605 snapshots every
# mountpoint before the parallel dispatch.
# The image's libzfs is stripped (--strip-unneeded), so static functions
# (put_stats_zhdl, zfs_mount_task, get_stats) show as ???; the exported
# zfs_prop_get / zfs_refresh_properties / zfs_mount_at frames identify the
# races.
# repro = master at the PR's merge base; fixed = the PR head.
TITLE='libzfs: zpool import -l races zfs_prop_get against put_stats_zhdl in the parallel mount (helgrind)'
REPO='https://github.com/tigerblue77/zfs'
