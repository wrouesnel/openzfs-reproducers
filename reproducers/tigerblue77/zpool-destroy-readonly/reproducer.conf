# Reproducer tigerblue77/zpool-destroy-readonly (docs/reproducer-format.md)
# openzfs/zfs#20008: `zpool destroy` of a pool imported with -o readonly=on
# exits 0 and prints nothing, but writes nothing to the devices: the labels
# keep the state they had at import (EXPORTED here), so `zpool import` still
# lists the pool as a normal exported pool, `zpool import -D` doesn't, and it
# imports by name without -D. The PR refuses the destroy (exit 1, "pool is
# imported read-only"; the kernel returns EROFS through POOL_CHECK_READONLY):
# the pool stays imported and mounted; exported and imported read-write, it
# is destroyed and only -D lists it.
# The PR brings its test (zpool_destroy_readonly_neg) with the fix:
# repro = the openzfs/zfs master commit it is based on; fixed = the PR head.
TITLE='zpool destroy: a pool imported read-only is reported destroyed, but its labels are not marked destroyed (it still imports by name)'
REPO='https://github.com/tigerblue77/zfs'
BRANCH='zpool-destroy-readonly-v2'
AUTHOR='@tigerblue77'
REPORTER='@tigerblue77'
PRS='20008'
ISSUES=''
BUILD_repro='https://github.com/openzfs/zfs@merge-base(zpool-destroy-readonly-v2)'
BUILD_fixed='https://github.com/tigerblue77/zfs@zpool-destroy-readonly-v2'
CONFIGURE='--enable-debug'
# a console demo on a file vdev: create, export, import -o readonly=on,
# zpool destroy; then zpool list, zpool import, zpool import -D and zdb -l's
# pool state; then the read-write import and destroy
EXPECT_repro='RESULT BUG: zpool destroy of the read-only pool exited 0'
EXPECT_fixed='RESULT OK: zpool destroy refused the read-only pool'
MEM=2048
CPUS=2
TIMEOUT=600
DISKS=1
DISK_SIZE=1G
