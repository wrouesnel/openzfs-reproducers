# Reproducer tigerblue77/zil-normal-class-space (docs/reproducer-format.md)
# openzfs/zfs#20004: a fresh mirror of two 128 MiB files suspends within
# seconds under synchronous 8 KiB overwrites (sync=always, four writers),
# with 112 MiB still free.  Log blocks come from the normal class (a vdev of
# 7 metaslabs gets no embedded log metaslab), nothing counts them against
# the free space, and they stay allocated until their txg syncs: the log
# takes all the free space in the open txg, and that txg's own writes then
# fail with ENOSPC in syncing context.  openzfs/zfs#19755 charges each
# normal-class log block to the pool's root dsl_dir for its txg, so writers
# wait for a sync first.
# The PR brings its test (no_space/enospc_zil) with the fix:
# repro = the openzfs/zfs master commit it is based on; fixed = the PR head.
TITLE='Synchronous writes to a pool without a log device fill it with log blocks and suspend it with ENOSPC'
REPO='https://github.com/tigerblue77/zfs'
BRANCH='zil-normal-class-space'
AUTHOR='@tigerblue77'
REPORTER='@johnpwhite'
PRS='19755'
ISSUES='20004'
BUILD_repro='https://github.com/openzfs/zfs@merge-base(zil-normal-class-space)'
BUILD_fixed='https://github.com/tigerblue77/zfs@zil-normal-class-space'
CONFIGURE='--enable-debug'
# a console demo: the reporter's script as it is (120 s; the bug
# usually shows within 30 s), a once-a-second health/alloc/free/txg line, then
# zpool status -v, zpool list -p, the ereports and the log's counters
EXPECT_repro='RESULT BUG: the pool suspended'
EXPECT_fixed='RESULT OK: all'
PASS_ENV='WRITE_SECONDS TXG_TIMEOUT'
TARGETS='ubuntu24'
MEM=2048
CPUS=4
TIMEOUT=600
DISKS=1
DISK_SIZE=1G
