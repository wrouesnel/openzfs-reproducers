# Reproducer tigerblue77/auto-spare-anymirror-prefetch (docs/reproducer-format.md)
# openzfs/zfs#19989: ZTS auto_spare_002_pos fails now and then waiting for
# ZED to degrade file-1 (zts-report maybe list, #11889). Only demand reads
# post checksum ereports; with prefetch on, the test's sequential dd issues
# only its first two 1 MiB reads (128 blocks) as demand reads, so the ZED's
# 10 ereports come from however many of those the faulted leaf serves. The
# PR creates the test file system with prefetch=none.
# A test-only fix, one commit on master: repro = its base (master's test),
# fixed = the PR head.
# Master's test passes almost always as it is (6 of 6 runs of the plain test
# in this image; 1 in 60 failed on our VMs), because it always faults
# file-1, which here gets plenty of checksum errors. prep.sh runs each
# build's own test once per leaf (file-1 ... file-5 as FAULT_FILE). On
# master, some anymirror leaf then gets no checksum error at all (first
# run: file-3 in anymirror1, 0, while file-1 got 1289), as in
# @tigerblue77's master failures (anymirror2, CKSUM 0).
TITLE='ZTS: auto_spare_002_pos: disable prefetch on the test file system'
REPO='https://github.com/tigerblue77/zfs'
BRANCH='auto-spare-anymirror-prefetch'
AUTHOR='@tigerblue77'
REPORTER=''
PRS='19989'
ISSUES='19341 11889'
# a test-only (ZTS) fix: repro = master with the original test; fixed = the branch head
BUILD_repro='https://github.com/openzfs/zfs@merge-base(auto-spare-anymirror-prefetch)'
BUILD_fixed='https://github.com/tigerblue77/zfs@auto-spare-anymirror-prefetch'
CONFIGURE='--enable-debug'
# KIND=zts: the demo runs these ZTS tests, from each build's own commit
KIND='zts'
ZTS_TESTS='tests/functional/fault/auto_spare_002_pos'
TOOLS='draid file_write getversion mkfile zed'
EXPECT_repro='RESULT BUG'
EXPECT_fixed='RESULT OK'
ZTS_ITERATIONS=1
ZTS_NOTE_repro='auto_spare_002_every_leaf is master'\''s auto_spare_002_pos run once per leaf (prep.sh): file-1, then file-2 ... file-5 as the faulted leaf. With prefetch on, only the first 2 MiB of the dd are demand reads, and only demand reads post checksum ereports; an anymirror leaf that serves none of those reads gets no checksum error, and ZED never degrades it (wait_vdev_state ... DEGRADED 60). The plain test faults file-1 only, so it fails only when file-1 is such a leaf.'
ZTS_NOTE_fixed='auto_spare_002_every_leaf is the PR'\''s auto_spare_002_pos run once per leaf (prep.sh): file-1, then file-2 ... file-5 as the faulted leaf. With prefetch=none every read of the faulted leaf is a demand read, so each leaf gets thousands of checksum errors, and ZED degrades it and kicks in the spare in every layout.'
MEM=2048
CPUS=2
TIMEOUT=2700
DISKS=1
DISK_SIZE=16G
