# Reproducer juanmitaboada/zio-encrypt-fail (docs/reproducer-format.md)
# openzfs/zfs#19996: zio_encrypt() VERIFY0s the keyed calls
# (spa_do_crypt_abd() and the MAC helpers), so a write that reaches it
# without its dataset's key panics.  The PR fails such a write (EACCES) and
# suspends the pool instead.  The trigger is #18394's: after a pool suspend
# and `zpool clear` during a raw receive whose key isn't loaded, a block of
# dnodes is written as plaintext (the cause, fixed by #19975, is in
# arc_write_ready()); the demo is wrouesnel/fix-raw-recv-resume-encrypt-v2's
# without that fix.
TITLE='A write that reaches zio_encrypt() without its key panics (VERIFY0, EACCES) instead of failing'
REPO='https://github.com/juanmitaboada/zfs'
BRANCH='zio-encrypt-fail'
AUTHOR='@juanmitaboada'
REPORTER='@juanmitaboada'
PRS='19996'
ISSUES='18394'
# repro = the openzfs/zfs master commit the PR is based on; fixed = the PR head
BUILD_repro='https://github.com/openzfs/zfs@merge-base(zio-encrypt-fail)'
BUILD_fixed='https://github.com/juanmitaboada/zfs@zio-encrypt-fail'
CONFIGURE='--enable-debug'
EXPECT_repro='RESULT BUG: '
EXPECT_fixed='RESULT OK: '
MEM=2048
CPUS=2
TIMEOUT=900
DISKS=2
DISK_SIZE=1G
