# selftest-triggers: not a bug.  A self-test of the host trigger channel
# (docs/reproducer-format.md) that CI runs on every change, so the paths a
# trigger-based reproducer depends on keep working: two VMs sharing two run
# disks and linked by a private network, a disk throttle, I/O error
# injection, hot-unplug and replug, a pause, a power cut with a reboot that
# carries on, a host-side overwrite of a disk image, an import on the other
# VM (another hostid), and a copy of a disk while the VM runs.
TITLE='Self-test of the host trigger channel (not a bug)'
PRS=''
ISSUES=''
BASE='linux-ubuntu24'
BUILDS='ok'
# openzfs/zfs master (2026-10)
BUILD_ok='https://github.com/openzfs/zfs@b060bcb1d0148bb51a6c75142d5212ccd1824294'
CONFIGURE='--enable-debug'
EXPECT_ok='RESULT OK: zr self-test passed'
VMS=2
SHARED_DISKS=1
NETWORK=1
HOSTIDS='0000a001 0000a002'
MEM=768
CPUS=2
TIMEOUT=300
DISKS=2
DISK_SIZE=512M
