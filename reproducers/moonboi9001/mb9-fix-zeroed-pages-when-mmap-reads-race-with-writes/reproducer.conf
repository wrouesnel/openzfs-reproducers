# Reproducer moonboi9001/mb9-fix-zeroed-pages-when-mmap-reads-race-with-writes (docs/reproducer-format.md)
# openzfs/zfs#20038 (closes #14548): while one thread fills a file with
# write() and another reads it through a shared mapping, a record that
# write() has already stored can read back wrong (zeros) through the
# mapping on master, and read() then returns the same wrong data from the
# page cache.  With the PR every record reads back as written.
# The demo runs the PR's own test program (mmap_write_race, as its ZTS test
# mmap/mmap_write_race does) and the program from #14548.
# repro = the openzfs/zfs master commit the PR is based on; fixed = the PR head.
TITLE='mmap: a shared mapping read while write() fills the file shows wrong data for records already written'
REPO='https://github.com/MoonBoi9001/zfs'
BRANCH='mb9/fix-zeroed-pages-when-mmap-reads-race-with-writes'
AUTHOR='@MoonBoi9001'
REPORTER='@MoonBoi9001'
PRS='20038'
ISSUES='14548'
BUILD_repro='https://github.com/openzfs/zfs@merge-base(mb9/fix-zeroed-pages-when-mmap-reads-race-with-writes)'
BUILD_fixed='https://github.com/MoonBoi9001/zfs@mb9/fix-zeroed-pages-when-mmap-reads-race-with-writes'
CONFIGURE='--enable-debug'
EXPECT_repro='RESULT BUG: records written with write() read back wrong data through a shared mapping'
EXPECT_fixed='RESULT OK: records written with write() read back as written through a shared mapping'
MEM=1536
CPUS=2
TIMEOUT=900
DISKS=1
DISK_SIZE=1G
