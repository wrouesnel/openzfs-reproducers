# Reproducer wrouesnel/fix-nfs-reconnect-hint-v3-lustre (docs/reproducer-format.md):
# a compatibility check, not a bug: Lustre's osd-zfs on OpenZFS master and on
# the cookie branch (fix-nfs-reconnect-hint-v3, openzfs/zfs#16254), side by
# side in one VM.  A companion of wrouesnel/fix-nfs-reconnect-hint-v3 (the
# console demo) and -v3-stress; README.md says what it runs.
TITLE='Lustre (osd-zfs) on the directory entry cookie branch: same results as on master'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-nfs-reconnect-hint-v3'
AUTHOR='@wrouesnel'
REPORTER='@behlendorf asked (openzfs/zfs#16254)'
PRS=''
ISSUES='16254 18134'
# repro = the openzfs/zfs master commit the branch is based on, fixed = the
# branch head.  Each image holds BOTH builds (payload.sh builds OpenZFS and
# Lustre for each on AlmaLinux 9) and runs the same comparison; they differ
# only in the build the VM boots with, so either one is the whole check.
BUILD_repro='https://github.com/openzfs/zfs@merge-base(fix-nfs-reconnect-hint-v3)'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-nfs-reconnect-hint-v3'
# release builds, as in the spike (a debug build of master panics under
# Lustre: the opt-in debugpanic tag)
CONFIGURE='--enable-debuginfo'
EXPECT_repro='RESULT OK'
EXPECT_fixed='RESULT OK'
# Lustre's supported server kernels are RHEL's: only the almalinux9 target
# (5.14.0-687.x.el9_8), with its full module tree (BASE=ext: overlay, dummy,
# crc modules); Lustre runs in an AlmaLinux 9 chroot (payload.sh common)
TARGETS='almalinux9'
BASE='ext'
# 1 MDT + 2 OSTs (ZFS on file vdevs) and a client on one node; the spike used
# 8 vCPUs and 12 GiB.  At least 6 GiB; MEM/CPUS in the container's
# environment override these
MEM=8192
CPUS=6
# the default tags take about an hour (KVM); TIMEOUT covers a busy host
TIMEOUT=10800
# the run disk holds the chroots' writable layers and the Lustre targets'
# file vdevs (/tmp in the chroot)
DISKS=1
DISK_SIZE=24G
# LUSTRE_TAGS: the phases to run (README.md); LUSTRE_ONLY: sanity.sh's
# ONLY list, comma separated (default: the spike's subset)
PASS_ENV='LUSTRE_TAGS LUSTRE_ONLY'
# the scripts, as plain files in the image (/zfs-repro/repro/files/)
EXTRACT='demo.sh lustre.sh payload.sh README.md'
