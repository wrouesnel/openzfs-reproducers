# Reproducer wrouesnel/fix-send-taskq-killable (docs/reproducer-format.md)
# openzfs/zfs#12500: without HAVE_LARGE_STACKS (kernels with 8K stacks:
# 32-bit arm and i386 Linux, FreeBSD armv7) zfs_ioctl.c writes the send
# stream on a "z_send" taskq thread and the sending thread waits for it in
# taskq_wait(), uninterruptibly.  Taskq threads block all signals, so a
# `zfs send` blocked on a full pipe can't be killed: SIGKILL leaves it in D
# state, holding its snapshot, until the reader goes away.  The fix waits
# with cv_wait_sig() and interrupts the write on the taskq thread.
# x86_64 has large stacks, so the images are built with that path forced:
# each build is the branch commit plus one LOCAL-ONLY commit that turns
# `#ifndef HAVE_LARGE_STACKS` before `#define USE_SEND_TASKQ` into `#if 1`
# (the forced-path runs in the branch notes did the same).  Those commits
# are not public: they are served from a local repository
# (git daemon on 127.0.0.1:9419, /home/will/src/zfs-bug-hunt/wt/send-taskq-force.git):
#   fix-send-taskq-killable-force-repro = 94a32aead7 (test commit) + force
#   fix-send-taskq-killable-force       = fc89a4b63c (branch head) + force
# so this reproducer is BLOCKED (left out of CI and of publishing) until
# public force branches exist; build it with WITH_BLOCKED=1.
TITLE='zfs send blocked on a full pipe cannot be killed when it writes on the z_send taskq (small-stack kernels; path forced on x86_64)'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-send-taskq-killable'
AUTHOR='@wrouesnel'
REPORTER='openzfs/zfs#12500'
PRS=''
ISSUES='12500'
BLOCKED='local only: built from non-public force commits (USE_SEND_TASKQ on x86_64) served at git://127.0.0.1:9419; needs public force branches before CI or publishing'
BUILD_repro='git://127.0.0.1:9419/send-taskq-force.git@fix-send-taskq-killable-force-repro'
BUILD_fixed='git://127.0.0.1:9419/send-taskq-force.git@fix-send-taskq-killable-force'
CONFIGURE='--enable-debug'
EXPECT_repro='RESULT BUG: zfs send survived SIGKILL'
EXPECT_fixed='RESULT OK: zfs send exited'
MEM=1024
CPUS=2
TIMEOUT=300
DISKS=1
DISK_SIZE=512M
