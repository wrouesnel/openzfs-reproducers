# Reproducer wrouesnel/fix-send-taskq-killable (docs/reproducer-format.md)
# openzfs/zfs#12500: without HAVE_LARGE_STACKS (kernels with 8K stacks:
# 32-bit arm and i386 Linux, FreeBSD armv7) zfs_ioctl.c writes the send
# stream on a "z_send" taskq thread and the sending thread waits for it in
# taskq_wait(), uninterruptibly.  Taskq threads block all signals, so a
# `zfs send` blocked on a full pipe can't be killed: SIGKILL leaves it in D
# state, holding its snapshot, until the reader goes away.  The fix waits
# with cv_wait_sig() and interrupts the write on the taskq thread.
# x86_64 has large stacks, so the demo forces the small-stack path: each
# build is a public DEMO ONLY branch of the fork, the branch commit plus one
# commit "DEMO ONLY, not for merge: force the small-stack send taskq path"
# (`#ifndef HAVE_LARGE_STACKS` before `#define USE_SEND_TASKQ` -> `#if 1`):
#   fix-send-taskq-killable-forced-repro = the test commit + force
#   fix-send-taskq-killable-forced-fixed = the branch head + force
# The fix itself is fix-send-taskq-killable (without the force).
TITLE='zfs send blocked on a full pipe cannot be killed when it writes on the z_send taskq (small-stack kernels; the path is forced on x86_64 for the demo)'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-send-taskq-killable'
AUTHOR='@wrouesnel'
REPORTER='openzfs/zfs#12500'
PRS=''
ISSUES='12500'
BUILD_repro='https://github.com/wrouesnel/zfs@fix-send-taskq-killable-forced-repro'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-send-taskq-killable-forced-fixed'
CONFIGURE='--enable-debug'
EXPECT_repro='RESULT BUG: with the small-stack send taskq path forced on x86_64, zfs send survived SIGKILL'
EXPECT_fixed='RESULT OK: with the small-stack send taskq path forced on x86_64, zfs send exited'
MEM=1024
CPUS=2
TIMEOUT=300
DISKS=1
DISK_SIZE=512M
