# Reproducer wrouesnel/fix-nfs-reconnect-name (docs/reproducer-format.md): console demo
TITLE='zap_value_search: concurrent NFS reconnects in one large directory slow each other down'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-nfs-reconnect-name'
AUTHOR='@wrouesnel'
REPORTER='@clhedrick (openzfs/zfs#16254, openzfs/zfs#18134)'
PRS=''
ISSUES='18134 16254'
# a performance change with a regression test (it passes on master), so the
# break is the openzfs/zfs master commit the branch is based on; fixed = the
# branch head
BUILD_repro='https://github.com/openzfs/zfs@merge-base(fix-nfs-reconnect-name)'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-nfs-reconnect-name'
# a timing demo: a release build, as users run it (debug builds add per-lock
# bookkeeping that hides the difference; README.md)
CONFIGURE='--disable-debug'
EXPECT_repro='RESULT BUG'
EXPECT_fixed='RESULT OK'
MEM=4096
# 4 concurrent NFS clients and their nfsd threads need 4 vCPUs at least
CPUS=6
TIMEOUT=900
DISKS=1
DISK_SIZE=4G
# the NFS server (rpcbind, rpc.mountd, rpc.nfsd, exportfs) and client
# (mount.nfs), with the libraries they need that the extended userland lacks
# (libxml2, for rpc.mountd, pulls in libicu: most of the demo disk's size).
# On the demo disk, not in the shared extended userland: only this demo uses
# them.  The kernel's nfsd and nfs modules come from the extended base
EXTRA_PKGS='nfs-kernel-server nfs-common rpcbind libwrap0 libxml2 libicu74'
# nfsd and the NFS client are kernel modules, and the demo uses python3: the
# extended base
BASE='ext'
