# Reproducer wrouesnel/fix-recv-write-compress-type (docs/reproducer-format.md): bug #237
TITLE='zfs recv stores compressed DRR_WRITE records whose compression type cannot be read back'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-recv-write-compress-type'
AUTHOR='@wrouesnel'
REPORTER=''
PRS=''
ISSUES=''
# repro = the branch's test commit (master + the ZTS test and its crafted
# streams, no fix); fixed = the branch head (the stricter validator)
BUILD_repro='https://github.com/wrouesnel/zfs@fix-recv-write-compress-type~1'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-recv-write-compress-type'
CONFIGURE='--enable-debug'
# Console demo (demo.sh): a genuine zfs send -c control, then two of the
# branch's crafted streams (write-compress-off / -on, copied from
# tests/zfs-tests/tests/functional/rsend/), each received and read back:
# master stores both (wrong md5 / EIO on read), the fix rejects both
EXPECT_repro='RESULT BUG'
EXPECT_fixed='RESULT OK'
# the crafted streams, for anyone who wants to run them elsewhere
EXTRACT='write-compress-off.zsend.bz2 write-compress-on.zsend.bz2'
MEM=2048
CPUS=2
TIMEOUT=900
DISKS=1
DISK_SIZE=1G
