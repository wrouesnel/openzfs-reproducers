# Reproducer wrouesnel/fix-dnode-next-offset-backwards-v2 (docs/reproducer-format.md); scaffolded by scripts/new-reproducer.sh
TITLE='A long free of a sparse file is not chunked: the backward dnode_next_offset() search skips L1s'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-dnode-next-offset-backwards-v2'
AUTHOR='@wrouesnel'
REPORTER='@mmaybee'
PRS=''
ISSUES='19513'
# repro = the branch's test commit (the test, no fix); fixed = the branch head
BUILD_repro='https://github.com/wrouesnel/zfs@fix-dnode-next-offset-backwards-v2~1'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-dnode-next-offset-backwards-v2'
CONFIGURE='--enable-debug'
# KIND=zts: the demo runs these ZTS tests, from each build's own commit
KIND='zts'
ZTS_TESTS='tests/functional/truncate/truncate_sparse_chunks'
TOOLS='ctime draid file_trunc file_write getversion mkfile truncate_test'
EXPECT_repro='RESULT BUG'
EXPECT_fixed='RESULT OK'
ZTS_NOTE_repro='The bug: the "dmu_tx_dirty_frees_delay: N -> N (0)" line above shows 0 dirty-frees delays. The backward dnode_next_offset() search skipped the L1s of every earlier L2 (slot 0 of each L2 is empty), so get_next_chunk() found no chunk boundary and the truncate freed all 1024 L1s as one chunk, in one transaction that holds and reads every L1; the test fails with "freed in one chunk".'
ZTS_NOTE_fixed='The fix: the "dmu_tx_dirty_frees_delay: N -> M (D)" line above shows D > 0 delays. The search now starts an earlier L2 from its last L1 slot, so the 1024 L1s are freed in chunks of at most 256, and with zfs_per_txg_dirty_frees_percent=1 each chunk after the first waits for the next txg.'
MEM=2048
CPUS=2
TIMEOUT=1800
DISKS=1
DISK_SIZE=16G
