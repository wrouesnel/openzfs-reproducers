# Reproducer wrouesnel/fix-write-selfmap-rangelock (docs/reproducer-format.md)
# Linux: a write whose source is a shared mapping of the file being written.
# zfs_write() prefaults only the first 32M of the source before it takes the
# file's range lock; the rest is faulted in with the lock held, and that
# fault (zfs_getpage()) waits for the range lock the writer itself holds.
# The writer hangs in D state for good (openzfs #18135).  The branch's ZTS
# test mmap_write_selfmap writes a 32M+128K file onto itself, appends from
# a mapping of the file's tail (with and without the size made visible
# mid-write), checks an O_APPEND write stays contiguous next to another
# appender, and reads a file onto itself through a writable mapping while a
# writer queues behind the read; each must finish in 60 s with the right
# data.  On the break, the in-place, published-size and read cases hang
# (the test prints the hung threads' kernel stacks); the VM has to be
# thrown away afterwards.
# repro = the branch's test commit (branch~2, master's code); fixed = the
# branch head (two fix commits on top).
TITLE='Linux: a write sourced from a mapping of the same file hangs unkillably in zfs_getpage()'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-write-selfmap-rangelock'
AUTHOR='@wrouesnel'
REPORTER='@BenasPaulikas'
PRS=''
ISSUES='18135'
BUILD_repro='https://github.com/wrouesnel/zfs@fix-write-selfmap-rangelock~2'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-write-selfmap-rangelock'
CONFIGURE='--enable-debug'
# KIND=zts: the demo runs this ZTS test, from each build's own commit
KIND='zts'
ZTS_TESTS='tests/functional/mmap/mmap_write_selfmap'
TOOLS='mmap_write_selfmap'
ZTS_NOTE_repro='A writer that hung here is stuck in the kernel for good (D state, unkillable): its file stays busy until the VM is thrown away, so the end state may show the pool busy.'
EXPECT_repro='RESULT BUG'
EXPECT_fixed='RESULT OK'
MEM=2048
CPUS=2
TIMEOUT=1800
DISKS=1
DISK_SIZE=16G
