# Reproducer wrouesnel/fix-removal-suspend-svr-lifetime-v2 (docs/reproducer-format.md)
# openzfs/zfs#9357 (BUGS 295): an export or `zpool remove -s` suspends the
# removal thread with spa_vdev_remove_suspend(), which waits on the removal
# without the namespace lock.  When the removal completes meanwhile, its last
# txg frees the removal state (svr) in spa_finish_removal(), even while a
# woken suspend still has to use it (in ztest: EBUSY, VERIFY0P(mutex_owner())
# or a use after free).  The fix makes the free wait for the suspend.
# The branch's test commit adds a test-only tunable,
# zfs_removal_suspend_complete_race, that holds the removal at its
# completion until a suspend waits, and has the woken suspend retake
# svr_lock late; its stage then says what happened: 6 = the svr was freed
# after the suspend was done, 7 = it was freed while the suspend still used
# it (the suspend then steps aside, so no crash).  The demo runs the ZTS
# test removal_suspend_complete's two cases (export, remove -s).
# repro = the branch's test commit (master's code); fixed = the branch head.
TITLE='Device removal: the removal state is freed while a suspend (export, zpool remove -s) still uses it'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-removal-suspend-svr-lifetime-v2'
AUTHOR='@wrouesnel'
REPORTER='openzfs/zfs#9357'
PRS=''
ISSUES='9357'
BUILD_repro='https://github.com/wrouesnel/zfs@fix-removal-suspend-svr-lifetime-v2~1'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-removal-suspend-svr-lifetime-v2'
CONFIGURE='--enable-debug'
EXPECT_repro='RESULT BUG: the removal was freed while a suspend still used it'
EXPECT_fixed='RESULT OK: the removal was freed only after the suspend was done'
MEM=1024
CPUS=2
TIMEOUT=600
DISKS=1
DISK_SIZE=512M
