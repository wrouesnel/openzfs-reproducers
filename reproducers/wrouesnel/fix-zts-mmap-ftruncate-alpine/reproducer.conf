# Reproducer wrouesnel/fix-zts-mmap-ftruncate-alpine (docs/reproducer-format.md)
# A ZTS flake on slow runners (alpine3-24 in fork and upstream CI: fork
# zfs-qemu 44962925233, upstream 44955633933 and 44965541552, 140-221 s
# against the 90 s limit).  Master's mmap/mmap_ftruncate times the whole
# mmap_ftruncate program: dirtying 2G of mmap()'d pages, which is throttled
# by the pool's writeback, then ftruncate(fd, 0).  Only that last call is
# what the test is about (it blocks for the txg timeout, 180 s, when async
# writeback isn't ended early), and it stays near-instant on a slow pool.
# A test-only fix, one commit on master: repro = master's test, fixed = the
# branch head (time only ftruncate(), start writeback explicitly, check the
# dataset's nwritten, 256M).  prep.sh starts slow_pool.sh beside the run:
# once the test's file exists every I/O to the pool is delayed 200 ms, one
# at a time (zinject -D 200:1), the slow runner on every run, and it times
# the program's phases from outside.
TITLE='ZTS: mmap_ftruncate times 2G of throughput-bound mmap dirtying instead of the ftruncate() call, and fails on slow runners'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-zts-mmap-ftruncate-alpine'
AUTHOR='@wrouesnel'
REPORTER='@wrouesnel (fork and upstream CI, zfs-qemu alpine3-24)'
PRS=''
ISSUES=''
# a test-only (ZTS) fix: repro = master with the original test; fixed = the branch head
BUILD_repro='https://github.com/openzfs/zfs@merge-base(fix-zts-mmap-ftruncate-alpine)'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-zts-mmap-ftruncate-alpine'
CONFIGURE='--enable-debug'
KIND='zts'
ZTS_TESTS='tests/functional/mmap/mmap_ftruncate'
TOOLS='draid file_write getversion mkfile mmap_eof_extend mmap_ftruncate mmap_libaio mmap_read_truncate mmap_seek mmap_stale_check mmap_sync mmapwrite readmmap'
EXPECT_repro='RESULT BUG: ZTS failed: mmap_ftruncate'
EXPECT_fixed='RESULT OK: ZTS passed: mmap_ftruncate'
ZTS_ITERATIONS=1
ZTS_NOTE_repro='Every I/O to the pool was delayed 200 ms once the test'\''s file existed (slow_pool.sh, a slow CI runner). Master'\''s mmap_ftruncate times the whole program against TIMEOUT/2 = 90 s: nearly all of it is dirtying 2G of mmap()'\''d pages, which the kernel throttles to the pool'\''s writeback speed. The final ftruncate(fd, 0), the call the test is about, still took well under a second (slow_pool.sh, below), so the FAIL says nothing about async writeback.'
ZTS_NOTE_fixed='Every I/O to the pool was delayed 200 ms once the test'\''s file existed (slow_pool.sh, a slow CI runner). The fixed test starts writeback of its 256M explicitly, times only ftruncate(fd, 0) (its log_note above, in ms) against 90 s, and checks that the dataset'\''s nwritten grew by the file size, so the slow pool no longer decides the result.'
MEM=4096
CPUS=2
TIMEOUT=1800
DISKS=1
DISK_SIZE=16G
