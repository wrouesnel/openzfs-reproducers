# Reproducer wrouesnel/fix-zed-reap-sigchld-race-v5 (docs/reproducer-format.md); supersedes fix-zed-reap-sigchld-race-v3
TITLE='ZED: the reaper loses a zedlet'\''s SIGCHLD (pause() after wait4()) and its stop flag (cleared after start), so ZED stops running zedlets and ignores SIGTERM'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-zed-reap-sigchld-race-v5'
AUTHOR='@wrouesnel'
REPORTER=''
PRS=''
ISSUES=''
# Four commits on openzfs/zfs master: the test-only reaper delays
# (ZED_TEST_REAPER_WAIT_DELAY_MS, ZED_TEST_REAPER_START_DELAY_MS; inert when
# unset), the tests (events/zed_zedlet_reap, events/zed_reaper_stop), then
# the two fixes.  repro = the tests commit (hooks + tests, no fix), so each
# build runs its own commit's tests; fixed = the branch head.
BUILD_repro='https://github.com/wrouesnel/zfs@fix-zed-reap-sigchld-race-v5~2'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-zed-reap-sigchld-race-v5'
CONFIGURE='--enable-debug'
# KIND=zts: the demo runs these ZTS tests
KIND='zts'
ZTS_TESTS='tests/functional/events/zed_zedlet_reap tests/functional/events/zed_reaper_stop'
# zed for the events group's zed_setup; flock for the zedlets (bins)
TOOLS='draid file_write getversion mkfile zed_fd_spill-zedlet zed'
EXPECT_repro='RESULT BUG: ZTS failed'
EXPECT_fixed='RESULT OK'
ZTS_NOTE_repro='The bug: in zed_zedlet_reap the reaper slept past the first zedlet'\''s SIGCHLD and then waited in pause() forever ("ZED stuck ... after 0 of 1 zedlets", with the <defunct> zedlet listed above it), and in zed_reaper_stop the reaper cleared the stop request when it started, so ZED hung in pthread_join() ("ZED ignored SIGTERM").'
ZTS_NOTE_fixed='The fix: with the same test-only delays, ZED ran and reaped every zedlet in zed_zedlet_reap, and exited on SIGTERM while the reaper was still held in zed_reaper_stop; both tests pass.'
MEM=2048
CPUS=4
TIMEOUT=1800
DISKS=1
DISK_SIZE=16G
