# Reproducer wrouesnel/fix-zpl-fadvise-zos (docs/reproducer-format.md); scaffolded by scripts/new-reproducer.sh
TITLE='Linux: read the objset in zpl_fadvise() after entering'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-zpl-fadvise-zos'
AUTHOR='@wrouesnel'
REPORTER=''
PRS='19305'
ISSUES=''
# repro = the branch's test commit (the test, no fix); fixed = the branch head
BUILD_repro='https://github.com/wrouesnel/zfs@fix-zpl-fadvise-zos~1'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-zpl-fadvise-zos'
CONFIGURE='--enable-debug'
# KIND=zts: the demo runs these ZTS tests, from each build's own commit
KIND='zts'
ZTS_TESTS='tests/functional/fadvise/fadvise_recv'
TOOLS='draid file_fadvise file_write getversion mkfile'
EXPECT_repro='PANIC'
EXPECT_fixed='RESULT OK'
# a race: fadvise_recv's four fadvise loops and the receives need more than
# 2 vCPUs to meet (with 2 the unfixed build often passes, as in #19305's
# FreeBSD CI); with 4 vCPUs it panics within a minute, and three runs per
# boot leave room for a slow one
ZTS_ITERATIONS=3
MEM=2048
CPUS=4
TIMEOUT=1800
DISKS=1
DISK_SIZE=16G
