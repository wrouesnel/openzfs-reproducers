# Reproducer wrouesnel/fix-freebsd-rename-flags-v4a (docs/reproducer-format.md)
TITLE='FreeBSD: renameat2(AT_RENAME_EXCHANGE) on ZFS does a plain rename and destroys the target (v4a: the FreeBSD commits ported as-is)'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-freebsd-rename-flags-v4a'
AUTHOR='@wrouesnel'
REPORTER=''
PRS=''
ISSUES=''
# repro = the branch's test commit (fix-freebsd-rename-flags-v4a~3: the
# renameat2 tests on FreeBSD; module as on master); fixed = the branch head
BUILD_repro='https://github.com/wrouesnel/zfs@fix-freebsd-rename-flags-v4a~3'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-freebsd-rename-flags-v4a'
CONFIGURE='--enable-debug'
EXPECT_repro='RESULT BUG'
EXPECT_fixed='RESULT OK'
# FreeBSD only (AT_RENAME_EXCHANGE is FreeBSD 16 / stable/15 >= 1501501; the
# fix is in FreeBSD vnops): disks built on a FreeBSD VM
# (scripts/freebsd-image.sh), not in CI
SKIP_TARGETS='ubuntu22 ubuntu24 ubuntu26 debian12 debian13 almalinux8 almalinux9 almalinux10 fedora43 fedora44 alpine3-24'
LOCAL_TARGETS='freebsd16-0c'
EXTRACT='demo.sh rn2.c rnrace.c'
MEM=1024
CPUS=2
TIMEOUT=900
DISKS=1
DISK_SIZE=1G
