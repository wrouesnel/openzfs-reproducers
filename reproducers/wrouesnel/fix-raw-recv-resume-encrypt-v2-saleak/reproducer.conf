# Reproducer wrouesnel/fix-raw-recv-resume-encrypt-v2-saleak (docs/reproducer-format.md)
# Bug #277: sa_handle_get() leaks the SA handle and its bonus-buffer hold when
# sa_build_index() fails.  `zpool status -v` resolving a logged error in a
# dataset that is being raw received with its key loaded hits that (the
# bonus is still ciphertext), and `zpool export` then hangs forever in
# spa_evicting_os_wait().  Since fba33c3819 (#7487, zfs-0.8).
# A companion of wrouesnel/fix-raw-recv-resume-encrypt-v2 (bug #276): the same
# branch carries both test-then-fix pairs, #277 first:
#   BRANCH~3  #277 test   (master + test: the break)
#   BRANCH~2  #277 fix
#   BRANCH~1  #276 tests
#   BRANCH    #276 fix
TITLE='zpool export hangs after zpool status -v during a raw receive with the key loaded (sa_handle_get leaks a bonus hold)'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-raw-recv-resume-encrypt-v2'
AUTHOR='@wrouesnel'
REPORTER='@wrouesnel'
PRS=''
ISSUES=''
BUILD_repro='https://github.com/wrouesnel/zfs@fix-raw-recv-resume-encrypt-v2~3'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-raw-recv-resume-encrypt-v2~2'
CONFIGURE='--enable-debug'
# a console demo: paused raw receive, a logged error, load-key, zpool status
# -v, then zpool export with a 60 s bound; zpool status -v after each step
EXPECT_repro='RESULT BUG: zpool export hung after zpool status -v during the raw receive'
EXPECT_fixed='RESULT OK: zpool export finished after zpool status -v during the raw receive'
MEM=2048
CPUS=2
TIMEOUT=600
DISKS=2
DISK_SIZE=1G
