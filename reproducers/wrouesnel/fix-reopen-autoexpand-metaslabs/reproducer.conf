# Reproducer wrouesnel/fix-reopen-autoexpand-metaslabs (docs/reproducer-format.md)
# openzfs/zfs#12501: with autoexpand=on, a reopen (zpool reopen, or zed's
# reopen of a grown whole disk) records a grown device's size in the
# top-level vdev's vdev_asize, but nothing calls vdev_expand(), which adds
# the metaslabs for the new space.  So SIZE stays where it was and EXPANDSZ
# (max asize - asize) drops to 0: the space is neither usable nor shown as
# expandable.  Not specific to special vdevs (the issue's case; shown here).
# The fix requests the config update (vdev_expand) from vdev_open() when it
# grows a top-level vdev that has metaslabs.
# repro = the branch's test commit (master's code); fixed = the branch head.
TITLE='zpool reopen with autoexpand=on: a grown mirror keeps its old SIZE and EXPANDSZ reads 0'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-reopen-autoexpand-metaslabs'
AUTHOR='@wrouesnel'
REPORTER='openzfs/zfs#12501'
PRS=''
ISSUES='12501'
BUILD_repro='https://github.com/wrouesnel/zfs@fix-reopen-autoexpand-metaslabs~1'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-reopen-autoexpand-metaslabs'
CONFIGURE='--enable-debug'
EXPECT_repro='RESULT BUG: after zpool reopen with autoexpand=on'
EXPECT_fixed='RESULT OK: after zpool reopen with autoexpand=on'
MEM=1024
CPUS=2
TIMEOUT=300
DISKS=1
DISK_SIZE=512M
