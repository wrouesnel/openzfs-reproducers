# Reproducer wrouesnel/fix-failmode-create-continue-mkdir-uutils (docs/reproducer-format.md):
# a companion of wrouesnel/fix-failmode-create-continue-mkdir for the first of
# its three test fixes, which shows only with Ubuntu 26.04's mkdir (uutils
# coreutils 0.8.0): BASE='uutils' boots the standard base with that mkdir
# ("Tool variants").  On master the test fails at its mkdir step and stops
# there, before the export the main reproducer shows, so the two are apart.
TITLE='ZTS: failmode_create_continue relies on mkdir(1) failing on EIO (fails with uutils mkdir, Ubuntu 26.04)'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-failmode-create-continue-mkdir'
AUTHOR='@wrouesnel'
REPORTER=''
PRS=''
ISSUES=''
# a test-only (ZTS) fix: repro = master with the original test; fixed = the branch head
BUILD_repro='https://github.com/openzfs/zfs@merge-base(fix-failmode-create-continue-mkdir)'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-failmode-create-continue-mkdir'
CONFIGURE='--enable-debug'
KIND='zts'
ZTS_TESTS='tests/functional/failmode/failmode_create_continue'
TOOLS='draid file_write getversion mkfile'
EXPECT_repro='RESULT BUG'
EXPECT_fixed='RESULT OK'
ZTS_ITERATIONS=1
ZTS_NOTE_repro='/usr/bin/mkdir here is uutils coreutils 0.8.0, as on Ubuntu 26.04: when mkdir(2) fails with EIO but the directory exists afterwards (failmode=continue), it exits 0 where GNU mkdir exits 1, so the test sees "mkdir: blocked=0 rc=0" and fails. On a busy host it can instead fail with "entry missing": the test'"'"'s third bug (fixed too), the previous iteration'"'"'s resilver suspending the pool before the mkdir.'
ZTS_NOTE_fixed='/usr/bin/mkdir here is uutils coreutils 0.8.0, as on Ubuntu 26.04; the fixed test makes the directory with a single mkdir(2) (python3 os.mkdir), which returns the EIO whatever mkdir(1) does.'
MEM=2048
CPUS=2
TIMEOUT=1800
DISKS=1
DISK_SIZE=16G
# Ubuntu 26.04's mkdir: uutils coreutils 0.8.0 (userlands/ubuntu24-uutils)
BASE='uutils'
