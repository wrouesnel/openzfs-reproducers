# Reproducer wrouesnel/fix-zpl-fadvise-zos-v3a (docs/reproducer-format.md)
TITLE='Read the objset in the fadvise handlers after entering, v3a: deterministic (zfs_fadvise_pause, objset check)'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-zpl-fadvise-zos-v3a'
AUTHOR='@wrouesnel'
REPORTER=''
PRS='19305'
ISSUES='19175'
# repro = the branch's test commit (zfs_fadvise_pause hook + test, no fix);
# fixed = the branch head
BUILD_repro='https://github.com/wrouesnel/zfs@fix-zpl-fadvise-zos-v3a~1'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-zpl-fadvise-zos-v3a'
CONFIGURE='--enable-debug'
# KIND=zts: the demo runs these ZTS tests, from each build's own commit
KIND='zts'
ZTS_TESTS='tests/functional/fadvise/fadvise_recv'
TOOLS='draid file_fadvise file_write getversion mkfile'
# the hook holds posix_fadvise() while a whole 'zfs recv' runs; the unfixed
# handler keeps using the old objset after the receive.  On Linux that oopses
# in dnode_hold_impl() <- dmu_prefetch_user() on the first call; where it
# doesn't fault, the test still fails on the hook's "objset read before
# entering" message
EXPECT_repro='PANIC'
EXPECT_fixed='RESULT OK'
ZTS_ITERATIONS=3
MEM=2048
CPUS=2
TIMEOUT=900
DISKS=1
DISK_SIZE=16G
