# Reproducer wrouesnel/test-zil-concurrent-new-block-pr68 (docs/reproducer-format.md)
# openzfs/zfs#19766 (@bScones): concurrent sync writes into a new block log
# all-zero TX_WRITE payloads, so a crash plus ZIL replay writes zeros over
# acknowledged data.  No test-only delay: the natural race (zil_zero_race.c,
# 8 threads into block 1 of each new O_DSYNC file) on a frozen pool, then a
# crash image of the vdevs, zdb of its log, import (replay) and a check of
# every range.
# The branch is our ZTS test (test-zil-concurrent-new-block, on master) with
# @bScones's #19768 cherry-picked on top.
TITLE='Concurrent sync writes into a new block log zero payloads; ZIL replay writes zeros over acknowledged data'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='test-zil-concurrent-new-block-pr68'
AUTHOR='@bScones'
REPORTER='@bScones'
PRS='19768'
ISSUES='19766'
# repro = the openzfs/zfs master commit the branch is based on; fixed = the
# branch head (+ #19768)
BUILD_repro='https://github.com/openzfs/zfs@merge-base(test-zil-concurrent-new-block-pr68)'
BUILD_fixed='https://github.com/wrouesnel/zfs@test-zil-concurrent-new-block-pr68'
CONFIGURE='--enable-debug'
EXPECT_repro='RESULT BUG:'
EXPECT_fixed='RESULT OK:'
EXTRACT='demo.sh zil_zero_race.c'
# VM defaults: the race needs real parallelism
MEM=3072
CPUS=4
TIMEOUT=1200
DISKS=1
DISK_SIZE=1G
