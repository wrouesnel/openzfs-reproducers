# Reproducer wrouesnel/fix-zed-reap-sigchld-race-v3 (docs/reproducer-format.md); scaffolded by scripts/new-reproducer.sh
TITLE='ZED: the reaper loses a zedlet'\''s SIGCHLD (pause() after wait4()), so ZED stops running zedlets and ignores SIGTERM'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-zed-reap-sigchld-race-v3'
AUTHOR='@wrouesnel'
REPORTER=''
PRS=''
ISSUES=''
# One commit, the fix and its test together: repro = the openzfs/zfs master
# commit the branch is based on; fixed = the branch head.  Both builds run
# the branch's test (ZTS_SCRIPTS=fixed: master has no zed_zedlet_reap).
BUILD_repro='https://github.com/openzfs/zfs@merge-base(fix-zed-reap-sigchld-race-v3)'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-zed-reap-sigchld-race-v3'
CONFIGURE='--enable-debug'
# KIND=zts: the demo runs this ZTS test, from the fix head's scripts
KIND='zts'
ZTS_TESTS='tests/functional/events/zed_zedlet_reap'
ZTS_SCRIPTS='fixed'
# zed for the events group's zed_setup; the test pins ZED to CPU 0 with
# taskset (bins)
TOOLS='draid file_write getversion mkfile zed_fd_spill-zedlet zed'
EXPECT_repro='RESULT BUG: ZTS failed: zed_zedlet_reap'
EXPECT_fixed='RESULT OK: ZTS passed: zed_zedlet_reap'
ZTS_NOTE_repro='The bug: ZED stopped running zedlets part-way through the 200 events. The "ZED stuck for 30 s after N of N+1 zedlets" line above, with the <defunct> zedlet listed just before it, is the zombie the reaper never collected because its SIGCHLD arrived before pause().'
ZTS_NOTE_fixed='The fix: ZED ran and reaped a zedlet for every one of the 200 events ("ZED ran N zedlets up to eid ..." above, no <defunct> zedlet) and exited on SIGTERM.'
# A race that needs the host busy: the reaper has to lose its vCPU between
# wait4() and pause() while the zedlet exits.  ubuntu24, KVM, 12 host CPUs:
# one VM at a time, 0 of 73 test runs failed (13 single runs, then
# --check --runs 3 with 20 iterations each); 3 VMs at once, 2 of 12 single
# runs, and with 6 VMs at once (repro and fixed checks side by side) 3 of 60
# iterations (2 of 3 demos), each "ZED stuck for 30 s after N of N+1
# zedlets" with one [all-debug.sh] <defunct>, as in the libvirt VM.  The
# fix: 0 of 120 iterations (60 alone, 60 under that load).  So --check
# can't show it 3 of 3 on an idle host: blocked until the demo makes the
# reaper's CPU contended itself (to decide; EXPECT stays as it is).
BLOCKED='the race shows only when the host is busy (3 of 60 iterations with 6 VMs at once, 0 of 73 one VM at a time); --check needs it 3 of 3'
ZTS_ITERATIONS=20
MEM=2048
CPUS=4
TIMEOUT=3600
DISKS=1
DISK_SIZE=16G
