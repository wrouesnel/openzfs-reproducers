# Reproducer wrouesnel/zts-arcsummary-connreset (docs/reproducer-format.md); scaffolded by scripts/new-reproducer.sh
# Bug #124 (fix-zarcsummary-connreset), test only: the fix landed upstream as
# abd1561b80 "zarcsummary: handle reset output pipes" (#19547, @ooonea),
# without a test.  This branch is master + our ZTS test.
TITLE='zarcsummary dies with ConnectionResetError when a ksh pipeline reader exits early (test for #19547, ZTS flake zarcsummary_001_pos)'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='zts-arcsummary-connreset'
AUTHOR='@wrouesnel'
REPORTER=''
PRS=''
ISSUES='19341'
# repro = openzfs/zfs abd1561b80^ (the last master commit before the fix; a
# pin, since master now has the fix and no branch names that commit), running
# the branch head's test scripts (ZTS_SCRIPTS=fixed); fixed = the branch head
BUILD_repro='https://github.com/openzfs/zfs@b7cddd96f81ccca2b7e3d82311225e27deb52eab'
BUILD_fixed='https://github.com/wrouesnel/zfs@zts-arcsummary-connreset'
CONFIGURE='--enable-debug'
# KIND=zts: the demo runs these ZTS tests; both builds run the fix head's scripts
KIND='zts'
ZTS_TESTS='tests/functional/cli_user/misc/zarcsummary_001_pos'
ZTS_SCRIPTS='fixed'
TOOLS='draid file_write getversion mkfile zarcsummary'
EXPECT_repro='RESULT BUG'
EXPECT_fixed='RESULT OK'
# deterministic: the test sets up the reset itself (smallest send buffer,
# waits until zarcsummary is blocked writing, closes the reader unread)
ZTS_ITERATIONS=1
# the extended base: `zarcsummary -d` (the test's first checks) runs modinfo,
# which needs the kernel's module tree (modules.dep); the minimal base fails there
BASE='ext'
MEM=2048
CPUS=2
TIMEOUT=1800
DISKS=1
DISK_SIZE=16G
