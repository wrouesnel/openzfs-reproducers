# Reproducer wrouesnel/fix-raw-recv-resume-encrypt-v2 (docs/reproducer-format.md)
# Bug #276 (openzfs/zfs#18394): after a pool suspension during a raw receive,
# arc_write_ready() has turned raw (encrypted) dnode-block buffers into
# plaintext ones (hole bp of the failed write), so after `zpool clear` the next
# write of such a block is encrypted again: VERIFY0(spa_do_crypt_abd) failed
# (13) in zio_encrypt() when the key isn't loaded.
# The branch carries two test-then-fix pairs: #277 (test, fix) then #276
# (tests, fix).  This reproducer is #276's; #277's is the companion
# wrouesnel/fix-raw-recv-resume-encrypt-v2-saleak.
TITLE='A raw receive panics in zio_encrypt() (VERIFY0, EACCES) after a pool suspend and zpool clear'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-raw-recv-resume-encrypt-v2'
AUTHOR='@wrouesnel'
REPORTER='@juanmitaboada'
PRS=''
ISSUES='18394'
# repro = the #276 tests on top of the #277 fix (BRANCH~1); fixed = the head
BUILD_repro='https://github.com/wrouesnel/zfs@fix-raw-recv-resume-encrypt-v2~1'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-raw-recv-resume-encrypt-v2'
CONFIGURE='--enable-debug'
# a console demo: raw receive, the destination's disk fails (zinject), the
# pool suspends, zpool clear, zpool status -v after each step
EXPECT_repro='RESULT BUG: the raw receive hit VERIFY0'
EXPECT_fixed='RESULT OK: the raw receive survived the suspend and clear'
MEM=2048
CPUS=2
TIMEOUT=600
DISKS=2
DISK_SIZE=1G
