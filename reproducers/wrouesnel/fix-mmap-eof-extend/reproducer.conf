# Reproducer wrouesnel/fix-mmap-eof-extend: shell-style KEY=VALUE, read by
# builder/ and the images.  The id is the fix branch: its GitHub owner and
# its name, slugified (docs/reproducer-format.md).
TITLE='Linux: data stored through mmap past EOF becomes file data when the file is extended'
# the fix branch (public), and who wrote the fix / reported the bug
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-mmap-eof-extend'
AUTHOR='@wrouesnel'
REPORTER='openzfs/zfs#19220'
# upstream references (metadata; the image tags get pr/issue aliases)
PRS='19267'
ISSUES='19220'
# the two builds, REPO@SHA (full sha; reachable from a public ref):
#   repro  the break: the branch's test commit, without the fix
#   fixed  the fix: the branch head (= the PR head)
BUILD_repro='https://github.com/wrouesnel/zfs@c8b07a06fa77fcc4527c202cbd04479e8f938f43'
BUILD_fixed='https://github.com/wrouesnel/zfs@f1894abf56a6da2935343662fc4fa39e1e49097f'
CONFIGURE='--enable-debug'
# the start of the RESULT line each build's demo prints, and inspect.sh's
EXPECT_repro='RESULT BUG: data stored past EOF through mmap became file data'
EXPECT_fixed='RESULT OK: the extended range reads as zeros'
EXPECT_INSPECT_repro='RESULT BUG on disk: 4/4 files hold STALE-DATA past the old EOF'
EXPECT_INSPECT_fixed='RESULT OK on disk: 4/4 files read zeros past the old EOF'
# VM defaults
MEM=768
CPUS=2
TIMEOUT=120
DISKS=1
DISK_SIZE=1G
