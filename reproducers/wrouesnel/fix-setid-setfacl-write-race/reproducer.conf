# Reproducer wrouesnel/fix-setid-setfacl-write-race (docs/reproducer-format.md)
# acltype=posix on Linux: a write by another user with write access clears
# S_ISUID/S_ISGID in z_mode inside its transaction, but the inode's i_mode
# only catches up when the write ends.  If the owner runs setfacl with an
# extended ACL in between, master's zpl_set_posix_acl() computes the new
# mode from the stale i_mode and stores the set-id bits again; they are
# still on after the write has completed, and after export/import.  The
# fix takes the mode from z_mode under z_acl_lock, and zfs_dirty_inode()
# no longer lets i_mode put back a set-id bit z_mode has lost.
# The demo makes the order deterministic like the branch's ZTS test
# (acl/posix/posix_006_pos): a two-transaction write whose second
# transaction waits on a zinject-delayed read, and an ACL without execute
# bits so that second transaction doesn't clear the bits again.
# repro = the openzfs/zfs master commit the branch is based on (the branch
# is a ZTS test commit, then the fix); fixed = the branch head.
TITLE='acltype=posix: setfacl by the owner during a write by another user with write access puts back the set-id bits the write cleared'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-setid-setfacl-write-race'
AUTHOR='@wrouesnel'
REPORTER='@wrouesnel'
PRS=''
ISSUES=''
BUILD_repro='https://github.com/openzfs/zfs@merge-base(fix-setid-setfacl-write-race)'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-setid-setfacl-write-race'
CONFIGURE='--enable-debug'
EXTRA_PKGS='acl'
EXPECT_repro='RESULT BUG: set-id bits are on after a completed write by another user with write access, when the owner ran setfacl during it'
EXPECT_fixed='RESULT OK: set-id bits stay cleared after a completed write by another user with write access, when the owner ran setfacl during it'
MEM=1536
CPUS=2
TIMEOUT=600
DISKS=1
DISK_SIZE=1G
