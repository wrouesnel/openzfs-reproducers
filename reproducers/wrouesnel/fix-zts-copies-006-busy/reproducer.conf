# Reproducer wrouesnel/fix-zts-copies-006-busy (docs/reproducer-format.md); scaffolded by scripts/new-reproducer.sh
TITLE='ZTS: let udev settle before zfs_copies destroys the volume'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-zts-copies-006-busy'
AUTHOR='@wrouesnel'
REPORTER=''
PRS=''
ISSUES=''
# a test-only (ZTS) fix stacked on #19717's three ZTS commits: repro = the
# fix commit's parent (the original zfs_copies.kshlib); fixed = the branch head
BUILD_repro='https://github.com/wrouesnel/zfs@fix-zts-copies-006-busy~1'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-zts-copies-006-busy'
CONFIGURE='--enable-debug'
# KIND=zts: the demo runs these ZTS tests, from each build's own commit
KIND='zts'
ZTS_TESTS='tests/functional/cli_root/zfs_copies/zfs_copies_003_pos tests/functional/cli_root/zfs_copies/zfs_copies_006_pos'
TOOLS='draid file_write getversion mkfile'
EXPECT_repro='RESULT BUG'
EXPECT_fixed='RESULT OK'
# a flake that needs udev's watch rule (the extended base runs udev): closing
# the zvol after new_fs (006) or zpool create (003) makes udev probe it, and
# a destroy while the probe holds it fails with "dataset is busy".  The probe
# is too quick in this VM to hit the destroy, so udev/99-zvol-slow-probe.rules
# holds the zvol open 2 s on that probe, as on CI's slower VMs (on a Fedora 44
# VM, a 3% CPU quota on systemd-udevd did the same: 20/20 failures on the
# break, 50/50 passes with the fix).
ZTS_ITERATIONS=1
ZTS_NOTE_repro='udev/99-zvol-slow-probe.rules (this reproducer) holds the zvol open for 2 s when udev probes it after new_fs (006) or zpool create (003) closes it, widening the window as the slower CI VMs do: the test'\''s zfs destroy right after the umount / zpool destroy fails with "dataset is busy".'
ZTS_NOTE_fixed='udev/99-zvol-slow-probe.rules (this reproducer) holds the zvol open for 2 s when udev probes it after new_fs (006) or zpool create (003) closes it; the fixed test waits for udev (block_device_wait) and retries a busy destroy (log_must_busy), so the volume is destroyed.'
MEM=2048
CPUS=2
TIMEOUT=1800
DISKS=1
DISK_SIZE=16G
# the flake needs udev's watch rule opening the zvol after the write: the extended base runs udev
BASE='ext'
