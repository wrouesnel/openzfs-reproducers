# Reproducer wrouesnel/fix-zil-dmu-sync-alloc-hole-v4a (docs/reproducer-format.md)
# #19334 v4, option A (a uniform zio_ready() rule), on @ahrens's #19481 (ZIL:
# Don't acknowledge commits after a failed log block): the branch is master
# + #19481's commit + slog_replay_fs_003 + slog_replay_{fs,volume}_failed_write
# + the zio.c fix.  repro = the second test commit, i.e. master + #19481 +
# the tests, so the break shows the bug remains with #19481; fixed = the head.
TITLE='zio: errors known at READY skip the I/O and reach parents at READY (#19334 v4, on #19481)'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-zil-dmu-sync-alloc-hole-v4a'
AUTHOR='@wrouesnel'
REPORTER=''
PRS='19334'
ISSUES=''
# repro = the branch's test commits (the tests, no fix); fixed = the branch head
BUILD_repro='https://github.com/wrouesnel/zfs@fix-zil-dmu-sync-alloc-hole-v4a~1'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-zil-dmu-sync-alloc-hole-v4a'
CONFIGURE='--enable-debug'
# KIND=zts: the demo runs these ZTS tests, from each build's own commit
KIND='zts'
ZTS_TESTS='tests/functional/slog/slog_replay_fs_003 tests/functional/slog/slog_replay_fs_failed_write tests/functional/slog/slog_replay_volume_failed_write'
TOOLS='draid file_write getversion mkfile renameat2'
ZTS_NOTE_repro='Each test fills a frozen pool so that the dmu_sync() write of an indirect log record fails to allocate: its block (slog_replay_fs_003), or only its gang members (the *_failed_write tests, first case). The log block is written anyway: replay reads the hole as zeros ("Record 1 was replayed as zeros"), and zdb fails VERIFY3U(gio->io_size, ==, offset) in zio_gang_tree_issue() reading the incomplete gang block.'
ZTS_NOTE_fixed='The log block holding the failed record is not written, so replay ends before it: record 1 (block 1) keeps its old data, the later write is not replayed (its commit fell back to the txg), and the pool is healthy, scrubs clean and zdb -b finds no leaks.'
EXPECT_repro='RESULT BUG'
EXPECT_fixed='RESULT OK'
MEM=2048
CPUS=2
TIMEOUT=1800
DISKS=1
DISK_SIZE=16G
