# Reproducer wrouesnel/fix-nfs-reconnect-hint-v3-stress (docs/reproducer-format.md):
# a stress suite, not a bug reproducer.  A companion of
# wrouesnel/fix-nfs-reconnect-hint-v3 (same branch): it re-runs the v3
# stress tests that the PR's testing section cites, so reviewers can run them
# and extract the script (/demo/stress/v3_stress.py; README.md).
# Only a fixed- image: master has no cookies, no dirent_name kstat and no
# `zfs rewrite -N`, so the suite has nothing to check there.
TITLE='Directory entry cookies (#16254 v3): stress suite on the PR head (churn, ZAP shapes, normalization, links, send/recv, spill, long names, .zfs, rewrite -N permissions)'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-nfs-reconnect-hint-v3'
AUTHOR='@wrouesnel'
REPORTER='@clhedrick (openzfs/zfs#16254, openzfs/zfs#18134)'
PRS=''
ISSUES='16254 18134'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-nfs-reconnect-hint-v3'
# a debug build, as the v3 testing ran (assertions on)
CONFIGURE='--enable-debug'
EXPECT_fixed='RESULT OK'
# which tests, and how long (demo.sh): podman run -e STRESS_TAGS=churn,spill
PASS_ENV='STRESS_TAGS STRESS_SCALE'
# the scripts as plain files in the image too: /zfs-repro/repro/files/stress
# (podman run --rm --entrypoint cat IMAGE /zfs-repro/repro/files/stress/v3_stress.py)
EXTRACT='stress'
MEM=6144
# churn: 4 writer and 2 reconnect threads
CPUS=6
# the default scale takes about 7 minutes with KVM; STRESS_SCALE=1 about 16:
# podman run -e STRESS_SCALE=1 -e TIMEOUT=7200 ... --check
TIMEOUT=3600
DISKS=1
DISK_SIZE=16G
# python3 (ctypes: name_to_handle_at/open_by_handle_at), util-linux mount
# (.zfs automount) and setpriv: the extended base
BASE='ext'
