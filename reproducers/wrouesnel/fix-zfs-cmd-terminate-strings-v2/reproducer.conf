# Reproducer wrouesnel/fix-zfs-cmd-terminate-strings-v2 (docs/reproducer-format.md); scaffolded by scripts/new-reproducer.sh: bug #198
TITLE='Terminate the string fields of zfs_cmd_t and drr_toname'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-zfs-cmd-terminate-strings-v2'
AUTHOR='@wrouesnel'
REPORTER=''
PRS=''
ISSUES=''
# repro = the branch's test commit (the test, no fix); fixed = the branch head
BUILD_repro='https://github.com/wrouesnel/zfs@fix-zfs-cmd-terminate-strings-v2~1'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-zfs-cmd-terminate-strings-v2'
CONFIGURE='--enable-debug'
# KIND=zts: the demo runs these ZTS tests, from each build's own commit
KIND='zts'
ZTS_TESTS='tests/functional/libzfs/libzfs_unterminated_strings'
TOOLS='draid file_write getversion ioctl_unterminated libzfs_input_check libzfs_mnttab_cache_check mkfile'
EXPECT_repro='RESULT BUG'
EXPECT_fixed='RESULT OK'
ZTS_NOTE_repro='The bug: the "FRU is 8208 bytes" line above. ZFS_IOC_VDEV_SETFRU was given a zc_value that fills its 8192-byte field with no NUL, and zc_string set to "zc_string_marker". zc_value is read as a C string on into zc_string, so the FRU stored in the vdev label is zc_value followed by the marker, and the test fails with "FRU runs on into zc_string (8208 bytes)". The test stops there, before its receive half.'
ZTS_NOTE_fixed='The fix: the "FRU is 8191 bytes" lines above, before and after the export and import. zfsdev_ioctl_common() now terminates zc_value and zc_string as it already terminates zc_name, so a value that fills its field is cut to fit and the marker is not stored. Then a resumable receive whose BEGIN record has a drr_toname that fills its 256 bytes with no NUL fails cleanly with "receive: stream truncated", keeps the partial receive, and its resume token names drr_toname less its last byte ("resume token toname is 255 bytes"); zfs receive -A and a normal receive of the whole stream follow, and the received file matches the source.'
MEM=2048
CPUS=2
TIMEOUT=1800
DISKS=1
DISK_SIZE=16G
