# Reproducer wrouesnel/fix-deadlist-missing-bpobj-v2 (docs/reproducer-format.md)
# A dataset's deadlist ZAP has an entry naming a bpobj that doesn't exist
# (openzfs/zfs#19879: a failing DIMM).  On master every load of that
# deadlist's tree panics txg_sync: VERIFY0(bpobj_open(...)) failed (2) in
# dsl_deadlist_load_tree().  A snapshot of the dataset (dsl_deadlist_clone)
# is the first thing that loads it, so the snapshot hangs and the pool is
# stuck.  The fix treats such an entry as lost: it is reported, the blocks it
# listed are leaked, and the snapshot, the frees and the destroys work.
# The damage is made with `zhack deadlist damage -o OBJ` (frees the entry's
# bpobj, keeps the entry naming object OBJ, which is never allocated); the
# subcommand comes with the branch's test commit, so both builds have it.
# repro = the branch's test commit (master's code); fixed = the branch head.
TITLE='A deadlist entry whose bpobj is missing panics txg_sync on the next snapshot (VERIFY0 bpobj_open in dsl_deadlist_load_tree)'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-deadlist-missing-bpobj-v2'
AUTHOR='@wrouesnel'
REPORTER='openzfs/zfs#19879'
PRS=''
ISSUES='19879'
BUILD_repro='https://github.com/wrouesnel/zfs@fix-deadlist-missing-bpobj-v2~1'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-deadlist-missing-bpobj-v2'
CONFIGURE='--enable-debug'
EXPECT_repro='RESULT BUG: txg_sync PANIC'
EXPECT_fixed='RESULT OK: the lost bpobj was reported'
MEM=1024
CPUS=2
TIMEOUT=300
DISKS=1
DISK_SIZE=512M
