# Reproducer wrouesnel/fix-zil-commit-suspended (docs/reproducer-format.md)
# Bug #275: zil_commit_itx_assign()'s dmu_tx_assign(DMU_TX_SUSPEND) waits for
# a pool that is already suspended to resume, so sync(2)/syncfs(2) (and an
# unmount's sync_fs) block until a `zpool clear`, forever for a pool that
# can't be cleared, although zfs_sync() asks not to block (ZIL_COMMIT_NOW).
# Since 90a1e13df2 (zfs-2.4.0).
TITLE='sync(2)/syncfs(2) block forever on an already suspended pool (zil_commit_itx_assign waits for the resume)'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-zil-commit-suspended'
AUTHOR='@wrouesnel'
REPORTER='@wrouesnel'
PRS=''
ISSUES=''
# repro = the branch's test commit (test, then fix: BRANCH~1); fixed = the head
BUILD_repro='https://github.com/wrouesnel/zfs@fix-zil-commit-suspended~1'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-zil-commit-suspended'
CONFIGURE='--enable-debug'
# a console demo: suspend a pool (failmode=wait), sync, zpool status -v after
# each step, then zpool clear and check the data
EXPECT_repro='RESULT BUG: sync blocked on the suspended pool'
EXPECT_fixed='RESULT OK: sync returned EIO'
MEM=2048
CPUS=2
TIMEOUT=600
DISKS=1
DISK_SIZE=1G
