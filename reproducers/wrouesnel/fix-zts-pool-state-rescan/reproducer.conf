# Reproducer wrouesnel/fix-zts-pool-state-rescan (docs/reproducer-format.md)
# A ZTS flake (fork zfs-qemu 44973013373 and upstream 44962196233 on
# ubuntu24, an almalinux8 run on 2026-10-09).  procfs/pool_state's cleanup
# rescans the SCSI host to bring back the scsi_debug disk it removed, then
# asks get_debug_device for its name.  Right after the rescan lsscsi can
# print "unexpected scan_for_first error" in the device column (the disk's
# sysfs block/ dir exists but is still empty); get_debug_device retries only
# on "-", so it returns "unexpected", `ln /dev/unexpected` fails, the
# cleanup stops, and testpool2 stays SUSPENDED for the rest of the run (175
# later tests failed in one CI run).  A test-only fix, two commits on
# master: repro = master's tests, fixed = the branch head (get_debug_device
# waits for a block device; pool_state's cleanup waits for udev, rescans
# again, and falls back to a loop device so testpool2 is always cleared).
# The window didn't open in 30 local runs, so flaky_lsscsi.sh (prep.sh puts
# it on the tests' PATH as lsscsi) prints "unexpected" for the first 3
# lsscsi calls after remove_disk, the CI flake on every run.  Hung-task
# warnings are off: the test suspends testpool2 for 200 s on purpose.
TITLE='ZTS: pool_state'\''s cleanup takes lsscsi'\''s "unexpected scan_for_first error" for a disk name after the rescan and leaves testpool2 suspended'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-zts-pool-state-rescan'
AUTHOR='@wrouesnel'
REPORTER='@wrouesnel (fork and upstream CI, zfs-qemu ubuntu24 and almalinux8)'
PRS=''
ISSUES='14848'
# a test-only (ZTS) fix: repro = master with the original tests; fixed = the branch head
BUILD_repro='https://github.com/openzfs/zfs@merge-base(fix-zts-pool-state-rescan)'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-zts-pool-state-rescan'
CONFIGURE='--enable-debug'
KIND='zts'
ZTS_TESTS='tests/functional/procfs/pool_state'
TOOLS='@zts'
EXPECT_repro='RESULT BUG: ZTS failed: pool_state'
EXPECT_fixed='RESULT OK: ZTS passed: pool_state'
ZTS_ITERATIONS=1
ZTS_NOTE_repro='After remove_disk, the first 3 lsscsi calls that list the scsi_debug disk printed "unexpected scan_for_first error" in its device column (flaky_lsscsi.sh, as lsscsi does in CI right after the rescan; its log above shows the real line beside each). Master'\''s get_debug_device retries only on "-", so it returned "unexpected" on the first call, the cleanup'\''s `ln /dev/unexpected` failed and the cleanup stopped: testpool2 was never cleared or destroyed and is left SUSPENDED (above), with scsi_debug still loaded. The group'\''s cleanup then hangs on testpool2 until its timeout KILLs it, as in CI, where every later test whose cleanup touches pools failed too.'
ZTS_NOTE_fixed='After remove_disk, the first 3 lsscsi calls that list the scsi_debug disk printed "unexpected scan_for_first error" in its device column (flaky_lsscsi.sh, as lsscsi does in CI right after the rescan; its log above shows the real line beside each). The fixed get_debug_device only returns a name once it is a block device, so it waited past the 3 bad answers for the real disk; the cleanup linked it, cleared and destroyed testpool2 and unloaded scsi_debug: no pool is left behind (above).'
MEM=2048
CPUS=2
TIMEOUT=2400
DISKS=1
DISK_SIZE=16G
# pool_state needs scsi_debug (modprobe), lsscsi and udev: the extended base
BASE='ext'
