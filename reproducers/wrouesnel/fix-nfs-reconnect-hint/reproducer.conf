# Reproducer wrouesnel/fix-nfs-reconnect-hint (docs/reproducer-format.md): console demo
TITLE='Directory entry cookies: reconnecting NFS directories costs the same in any directory size'
# PRIVATE until the user's review (2026-10-22): the branch is only on the
# private Forgejo backup, so REPO and BUILD_fixed name it there.  Before
# publishing: push the branch to github.com/wrouesnel/zfs and point both at
# 'https://github.com/wrouesnel/zfs' (as wrouesnel/fix-nfs-reconnect-name).
REPO='https://will@will.git.monolith.wrouesnel.com/will/zfs.git'
BRANCH='fix-nfs-reconnect-hint'
AUTHOR='@wrouesnel'
REPORTER='@clhedrick (openzfs/zfs#16254, openzfs/zfs#18134)'
PRS=''
ISSUES='16254 18134'
# a performance change (the ZTS test checks the cookies, it isn't a timing
# test), so the break is the openzfs/zfs master commit the branch stack is
# based on; fixed = the branch head (fix-nfs-reconnect-name + the cookie)
BUILD_repro='https://github.com/openzfs/zfs@merge-base(fix-nfs-reconnect-hint)'
BUILD_fixed='https://will@will.git.monolith.wrouesnel.com/will/zfs.git@fix-nfs-reconnect-hint'
# a timing demo: a release build, as users run it (README.md of
# wrouesnel/fix-nfs-reconnect-name: debug builds add lock bookkeeping)
CONFIGURE='--disable-debug'
EXPECT_repro='RESULT BUG'
EXPECT_fixed='RESULT OK'
# 1.1 million entries (three directories) stay in the ARC
MEM=8192
# 4 concurrent NFS clients and their nfsd threads
CPUS=6
TIMEOUT=1200
DISKS=1
DISK_SIZE=4G
# the NFS server and client, as wrouesnel/fix-nfs-reconnect-name
EXTRA_PKGS='nfs-kernel-server nfs-common rpcbind libwrap0 libxml2 libicu74'
# nfsd/nfs kernel modules and python3 (with ctypes): the extended base
BASE='ext'
