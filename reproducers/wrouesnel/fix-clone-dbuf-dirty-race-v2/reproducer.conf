# Reproducer wrouesnel/fix-clone-dbuf-dirty-race-v2 (docs/reproducer-format.md); scaffolded by scripts/new-reproducer.sh
TITLE='Concurrent writes into a block cloned in the same txg race in dmu_buf_will_dirty (dbuf_verify panic, dirty record list corruption)'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-clone-dbuf-dirty-race-v2'
AUTHOR='@wrouesnel'
REPORTER='@myers'
PRS=''
ISSUES='19739'
# repro = the branch's test commit (the test, no fix); fixed = the branch head
BUILD_repro='https://github.com/wrouesnel/zfs@fix-clone-dbuf-dirty-race-v2~1'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-clone-dbuf-dirty-race-v2'
CONFIGURE='--enable-debug'
# KIND=zts: the demo runs these ZTS tests, from each build's own commit
KIND='zts'
ZTS_TESTS='tests/functional/block_cloning/block_cloning_concurrent_write'
TOOLS='clone_after_trunc clone_mmap_cached clone_mmap_write clonefile ctime draid file_write getversion mkfile'
EXPECT_repro='RESULT BUG'
EXPECT_fixed='RESULT OK'
# the debug build's dbuf_verify() catches the race: VERIFY0(buf[i]) / PANIC at dbuf.c:...:dbuf_verify()
ZTS_NOTE_repro='The break: a writer saw the cloned block cached, not dirty, over a hole (dbuf_verify VERIFY0(buf[i]) panic in the write path); the pool hangs behind the panicked writer.'
ZTS_NOTE_fixed='The fix: 11 rounds of 32 concurrent writers into blocks cloned in the same txg; each round the clone holds only the written pattern, the source is unchanged, bcloneused is 0, and the final scrub finds no errors.'
# 32 fio jobs write into each cloned 128K block at once: enough vCPUs to race
MEM=3072
CPUS=4
TIMEOUT=1800
DISKS=1
DISK_SIZE=16G
