# Reproducer wrouesnel/fix-raidz-expand-rangelock-intr-v2 (docs/reproducer-format.md); scaffolded by scripts/new-reproducer.sh
TITLE='raidz expansion hangs when a read retry of another copy waits for the expansion lock in the read interrupt thread'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-raidz-expand-rangelock-intr-v2'
AUTHOR='@wrouesnel'
REPORTER='@wrouesnel (fork CI zfs-qemu: raidz_expand_011_pos hung on almalinux9)'
PRS=''
ISSUES=''
# bug #245 (zfs-bug-hunt BUGS.md); v2 = rebased onto openzfs master c913da8615
# repro = the branch's test commit (the test, no fix); fixed = the branch head
BUILD_repro='https://github.com/wrouesnel/zfs@fix-raidz-expand-rangelock-intr-v2~1'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-raidz-expand-rangelock-intr-v2'
CONFIGURE='--enable-debug'
# KIND=zts: the demo runs these ZTS tests, from each build's own commit
KIND='zts'
ZTS_TESTS='tests/functional/raidz/raidz_expand_mirror_retry'
TOOLS='draid file_write getversion mkfile randwritecomp'
EXPECT_repro='RESULT BUG'
EXPECT_fixed='RESULT OK'
ZTS_NOTE_repro='Without the fix the reads of the files never finish: a retry of the second copy (DVA) waits for the expansion range lock in the only read interrupt thread (z_rd_int), which the reflow chunk holding the lock needs for its own reads. The hung-task report names z_rd_int in zfs_rangelock_enter_reader() under vdev_mirror_io_done(); the pool, the expansion and txg sync stay hung.'
ZTS_NOTE_fixed='With the fix a retry that cannot get the range lock at once is moved to the read issue taskq and waits there: the reads finish with the right data, the first copies show read errors (the injected failures), the expansion completes and the scrub finds 0 errors.'
MEM=3072
CPUS=2
TIMEOUT=1800
DISKS=1
DISK_SIZE=16G
