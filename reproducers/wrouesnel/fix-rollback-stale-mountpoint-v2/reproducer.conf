# Reproducer wrouesnel/fix-rollback-stale-mountpoint-v2 (docs/reproducer-format.md)
# Follow-up to openzfs/zfs#12460 (Linux).  A child filesystem is created
# after the snapshot its parent is rolled back to, so its mountpoint
# directory isn't in the snapshot.  The rollback leaves that directory's
# inode stale; zfs_resume_fs() drops stale dentries but keeps this one,
# since a filesystem is mounted on it.  Nothing drops it after the child is
# destroyed (unmounted), so the parent's dcache keeps mapping the name to
# the stale inode: stat gives EIO, and a new child of the same name fails to
# mount ("failed to create mountpoint: File exists") until the parent is
# remounted.  The fix: zpl_dentry_delete() doesn't keep a dentry with a
# stale inode once its last reference goes.
# repro = the branch's test commit (master's code); fixed = the branch head.
TITLE='Linux: after a parent rollback and destroying its child, the stale mountpoint dentry stays (EIO) and a new child cannot mount'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-rollback-stale-mountpoint-v2'
AUTHOR='@wrouesnel'
REPORTER='openzfs/zfs#12460'
PRS=''
ISSUES='12460'
BUILD_repro='https://github.com/wrouesnel/zfs@fix-rollback-stale-mountpoint-v2~1'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-rollback-stale-mountpoint-v2'
CONFIGURE='--enable-debug'
EXPECT_repro='RESULT BUG: after the rollback and destroy'
EXPECT_fixed='RESULT OK: after the rollback and destroy'
MEM=1024
CPUS=2
TIMEOUT=300
DISKS=1
DISK_SIZE=512M
