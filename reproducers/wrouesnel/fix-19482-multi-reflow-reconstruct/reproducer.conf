# Reproducer wrouesnel/fix-19482-multi-reflow-reconstruct (docs/reproducer-format.md)
# openzfs/zfs#19482 (several disks in one raidz expansion, @ThatRetiredDude)
# merged onto current master.  Master's raidz_simulate_failure() (4a1a69f2ca,
# #19433) numbers the rows the reflow has not copied yet by
# physical_width - 1, the old width of a one-disk expansion; after a k-disk
# attach they are vre_old_width wide.  A scrub during a 3 -> 6 expansion then
# can't repair a block straddling the reflow offset with one damaged disk.
# The branch: merge of #19482 onto master, the test, the fix (rr_old_width).
TITLE='raidz expansion by several disks (#19482) on master: a scrub during the reflow cannot repair one damaged disk in a block straddling the reflow offset'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-19482-multi-reflow-reconstruct'
AUTHOR='@wrouesnel'
REPORTER=''
PRS='19482'
ISSUES=''
# repro = the test commit (merge + test, no fix); fixed = the branch head
BUILD_repro='https://github.com/wrouesnel/zfs@fix-19482-multi-reflow-reconstruct~1'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-19482-multi-reflow-reconstruct'
CONFIGURE='--enable-debug'
# KIND=zts: the demo runs these ZTS tests, from each build's own commit
KIND='zts'
ZTS_TESTS='tests/functional/raidz/raidz_expand_multi_boundary_repair'
TOOLS='draid file_write getversion mkfile randwritecomp'
EXPECT_repro='RESULT BUG'
EXPECT_fixed='RESULT OK'
ZTS_NOTE_repro='The break: raidz1 3 -> 6 in one attach, reflow paused, one old disk damaged before the expansion; the scrub reports a permanent error for a block straddling the reflow offset, and the undamaged disks get checksum errors.'
ZTS_NOTE_fixed='The fix: the same scrub repairs the straddling block (no known data errors, file checksum unchanged) for old disks 0 and 2, and a second scrub after the expansion repairs nothing.'
MEM=2048
CPUS=2
TIMEOUT=1800
DISKS=1
DISK_SIZE=16G
