# Reproducer wrouesnel/fix-failmode-create-continue-mkdir (docs/reproducer-format.md); scaffolded by scripts/new-reproducer.sh
TITLE='ZTS: failmode_create_continue leaves an exported testpool behind (large_dnode_009_pos fails next)'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-failmode-create-continue-mkdir'
AUTHOR='@wrouesnel'
REPORTER=''
PRS=''
ISSUES=''
# a test-only (ZTS) fix: repro = master with the original test; fixed = the branch head
BUILD_repro='https://github.com/openzfs/zfs@merge-base(fix-failmode-create-continue-mkdir)'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-failmode-create-continue-mkdir'
CONFIGURE='--enable-debug'
# KIND=zts: the demo runs these ZTS tests, from each build's own commit
KIND='zts'
ZTS_TESTS='tests/functional/failmode/failmode_create_continue tests/functional/features/large_dnode/large_dnode_009_pos'
TOOLS='draid file_write getversion mkfile mmap_write_sync stride_dd xattrtest'
EXPECT_repro='RESULT BUG'
EXPECT_fixed='RESULT OK'
# Three test fixes (c7d94b0093, 02167b741e, 48d5ca07db). This image shows
# the second, which is deterministic: master's test ends with `zpool export`,
# so its cleanup destroys nothing and two of the three loop DISKS keep an
# exported testpool's labels; the next test that imports testpool by name
# (large_dnode_009_pos, as in CI's run order) finds two pools.  The first
# (uutils mkdir's exit status) needs Ubuntu 26.04's userland and the third
# (a resilver race on slow storage) needs a slow disk: neither shows here.
ZTS_ITERATIONS=1
ZTS_NOTE_repro='failmode_create_continue ends with zpool export, so its cleanup destroys nothing and two loop disks keep an exported testpool; large_dnode_009_pos then imports testpool by name and finds two pools ("more than one matching pool"). Rarely (0 of 10 runs with 4 CPUs here; 1 in 3 to 1 in 10 with 2, more on a busy host) failmode_create_continue fails first instead, with "entry missing": its third bug, the previous iteration'"'"'s resilver suspending the pool before the operation (also fixed); it then stops before the export, and large_dnode_009_pos passes.'
ZTS_NOTE_fixed='failmode_create_continue re-imports its pool by guid after the export, so its cleanup destroys it; large_dnode_009_pos then finds only its own exported testpool.'
MEM=2048
# 4 CPUs: with 2, the third bug (below) cut the failmode test short in 1 of
# 3 to 1 of 10 runs, so large_dnode_009_pos had no leftover pool to find
CPUS=4
TIMEOUT=1800
DISKS=1
DISK_SIZE=16G
