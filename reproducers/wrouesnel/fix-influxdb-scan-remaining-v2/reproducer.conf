# Reproducer wrouesnel/fix-influxdb-scan-remaining-v2 (docs/reproducer-format.md)
# zpool_influxdb computes a running scan's remaining_t as
# to_examine - examined / rate: seconds subtracted from bytes, and from the
# examined bytes and this pass's examine rate.  A sorted scrub examines
# everything early, and then the pass counters are reset (pass_examined and
# rate print as 1), so remaining_t is to_examine - examined: a number of
# bytes, 0 here.  zpool status estimates from the bytes still to issue and
# the issue rate, and so does the fix.
# The demo slows a disk with zinject, starts a scrub, and prints
# zpool_influxdb's line and `zpool status` side by side.
# repro = the openzfs/zfs master commit the branch is based on (the branch
# is a ZTS test commit, then the fix); fixed = the branch head.
TITLE='zpool_influxdb: remaining_t of a running scrub is not a time'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-influxdb-scan-remaining-v2'
AUTHOR='@wrouesnel'
REPORTER='@ajaxous'
PRS=''
ISSUES='16771'
BUILD_repro='https://github.com/openzfs/zfs@merge-base(fix-influxdb-scan-remaining-v2)'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-influxdb-scan-remaining-v2'
CONFIGURE='--enable-debug'
TOOLS='zpool_influxdb'
EXPECT_repro='RESULT BUG: zpool_influxdb printed remaining_t='
EXPECT_fixed='RESULT OK: zpool_influxdb and zpool status agree on the remaining time of the scrub'
MEM=1536
CPUS=2
TIMEOUT=600
DISKS=1
DISK_SIZE=2G
