# Reproducer wrouesnel/fix-compat-ioctl-fsxattr (docs/reproducer-format.md)
# Linux: a 32-bit program on a 64-bit kernel reaches the filesystem's
# compat_ioctl handler.  master's zpl_compat_ioctl() has no case for
# FS_IOC_FSGETXATTR/FS_IOC_FSSETXATTR (project IDs), and since Linux 5.13
# the compat ioctl system call turns FS_IOC32_GETFLAGS/SETFLAGS into the
# native numbers before it calls the handler, so its FS_IOC32_* cases are
# no longer reached either: all four return ENOTTY.  The fix passes the
# four through (the 32-bit and 64-bit layouts are the same).
# The demo issues the 32-bit ioctls with compat_ioctl (the branch's ZTS
# helper): a 64-bit program making 32-bit system calls with "int $0x80".
# repro = the branch's test commit (master's code); fixed = the branch head.
TITLE='Linux: 32-bit programs get ENOTTY for the file flag and project ID ioctls (lsattr, chattr, chattr -p)'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-compat-ioctl-fsxattr'
AUTHOR='@wrouesnel'
REPORTER='@kcid9660'
PRS=''
ISSUES=''
BUILD_repro='https://github.com/wrouesnel/zfs@fix-compat-ioctl-fsxattr~1'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-compat-ioctl-fsxattr'
CONFIGURE='--enable-debug'
EXPECT_repro='RESULT BUG: 32-bit file flag and project ID ioctls fail with ENOTTY'
EXPECT_fixed='RESULT OK: 32-bit programs read and set file flags and project IDs'
MEM=1024
CPUS=2
TIMEOUT=300
DISKS=1
DISK_SIZE=512M
