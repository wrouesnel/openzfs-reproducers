# Reproducer wrouesnel/fix-zts-errata3-busy (docs/reproducer-format.md); scaffolded by scripts/new-reproducer.sh
TITLE='ZTS: wait for udev'\''s zvol probe in zpool_import_errata3'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-zts-errata3-busy'
AUTHOR='@wrouesnel'
REPORTER=''
PRS=''
ISSUES=''
# a test-only (ZTS) fix: repro = master with the original test; fixed = the branch head
BUILD_repro='https://github.com/openzfs/zfs@merge-base(fix-zts-errata3-busy)'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-zts-errata3-busy'
CONFIGURE='--enable-debug'
# KIND=zts: the demo runs these ZTS tests, from each build's own commit
KIND='zts'
ZTS_TESTS='tests/functional/cli_root/zpool_import/zpool_import_errata3'
TOOLS='draid file_write getversion mkfile zgenhostid'
EXPECT_repro='RESULT BUG'
EXPECT_fixed='RESULT OK'
# a flake that needs udev's watch rule (the extended base runs udev).  Its
# probe is too quick in this VM to hit the export (0 failures in 20 runs), so
# udev/99-zvol-slow-probe.rules holds the zvol open 2 s on that probe, as on
# CI's slower VMs: the break then fails every run, the fix waits for it.
ZTS_ITERATIONS=1
ZTS_NOTE_repro='udev/99-zvol-slow-probe.rules (this reproducer) holds the zvol open for 2 s when udev probes it after the dd, widening the window as CI's slower VMs do: the export the test runs 0.2 s later fails with "pool is busy".'
ZTS_NOTE_fixed='udev/99-zvol-slow-probe.rules (this reproducer) holds the zvol open for 2 s when udev probes it after the dd; the fixed test waits for the probe (block_device_wait) before it exports.'
MEM=2048
CPUS=2
TIMEOUT=1800
DISKS=1
DISK_SIZE=16G
# the flake needs udev's watch rule opening the zvol after dd: the extended base runs udev
BASE='ext'
