# Reproducer wrouesnel/fix-zts-l2arc-dwpd-ratelimit (docs/reproducer-format.md); scaffolded by scripts/new-reproducer.sh
TITLE='ZTS: l2arc_dwpd_ratelimit_pos is KILLED on a slow disk, and the next l2arc test fails with "part of active pool"'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-zts-l2arc-dwpd-ratelimit'
AUTHOR='@wrouesnel'
REPORTER=''
PRS=''
ISSUES=''
# a test-only (ZTS) fix: repro = master with the original test; fixed = the branch head
BUILD_repro='https://github.com/openzfs/zfs@merge-base(fix-zts-l2arc-dwpd-ratelimit)'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-zts-l2arc-dwpd-ratelimit'
CONFIGURE='--enable-debug'
# KIND=zts: the demo runs these ZTS tests, from each build's own commit.
# The slow CI runner is made deterministic by host.sh: the run disk (which
# holds the test's pool and cache files) is limited to 10 MB/s while
# l2arc_dwpd_ratelimit_pos runs, and the limit is lifted when it ends, so
# l2arc_dwpd_reimport_pos (the next test in the l2arc group, as in CI) runs
# at full speed and shows only the knock-on of the kill.
KIND='zts'
ZTS_TESTS='tests/functional/l2arc/l2arc_dwpd_ratelimit_pos tests/functional/l2arc/l2arc_dwpd_reimport_pos'
TOOLS='draid file_write getversion mkfile mkfiles'
EXPECT_repro='RESULT BUG'
EXPECT_fixed='RESULT OK'
ZTS_NOTE_repro='The run disk was limited to 10 MB/s (qemu block throttle, from the container) while l2arc_dwpd_ratelimit_pos ran, as on a slow CI runner. Master'\''s test writes about 7.6 GB, so it was KILLED at its 600 s timeout; its cleanup never ran and its dd kept testpool busy, so l2arc_dwpd_reimport_pos (run at full disk speed) failed with "part of active pool", as in CI (fedora44 job 126335932883, almalinux10 job 121507797219).'
ZTS_NOTE_fixed='The run disk was limited to 10 MB/s (qemu block throttle, from the container) while l2arc_dwpd_ratelimit_pos ran, as on a slow CI runner. The fixed test writes about 500 MB and checks each DWPD limit against its budget, so it passed in a few minutes; l2arc_dwpd_reimport_pos (run at full disk speed) then found no pool left behind and passed.'
MEM=4096
CPUS=4
TIMEOUT=2400
DISKS=1
DISK_SIZE=16G
