# Reproducer wrouesnel/fix-zts-mmp-suspend-hang (docs/reproducer-format.md)
# Bug #274: ZTS mmp_on_off runs with zfs_multihost_interval=100 and the
# default 10 fail intervals, so one MMP write slower than 1 s suspends its
# pool.  A pool suspended by MMP can't be cleared on its own host (#19033):
# the test's cleanup fails at `zpool clear` ("imported on a different host")
# and leaves the suspended pool imported.  In CI (fork zfs-qemu 43540734393,
# ubuntu22) the next mmp tests failed, and mmp_on_zdb's cleanup destroyed
# the pool: its unmount waited forever and the job hit its 300-minute limit.
# A test-only fix, one commit on master: repro = its parent (master's test),
# fixed = the branch head (fail intervals 0 in mmp_on_off, an ONLINE check
# at its end, mmp_clear_suspended() asks the state kstat).  prep.sh starts
# inject_mmp_delay.sh beside the run: the CI's slow MMP write, every time.
TITLE='ZTS: one slow MMP write suspends mmp_on_off'\''s pool, which then can'\''t be cleared and is left behind'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-zts-mmp-suspend-hang'
AUTHOR='@wrouesnel'
REPORTER='@wrouesnel (fork CI, zfs-qemu ubuntu22)'
PRS=''
ISSUES='19033'
BUILD_repro='https://github.com/wrouesnel/zfs@fix-zts-mmp-suspend-hang~1'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-zts-mmp-suspend-hang'
CONFIGURE='--enable-debug'
KIND='zts'
ZTS_TESTS='tests/functional/mmp/mmp_on_off'
TOOLS='zgenhostid'
EXPECT_repro='RESULT BUG'
EXPECT_fixed='RESULT OK'
ZTS_NOTE_repro='MMP writes were delayed 1.5 s for 3 s once multihost=on (inject_mmp_delay.sh, the CI stall). Master'\''s mmp_on_off keeps the default 10 fail intervals at zfs_multihost_interval=100, so MMP suspends the pool after 1 s; its body still passes, but its cleanup'\''s zpool clear is refused ("imported on a different host", #19033) and the suspended pool stays imported for every later test.'
ZTS_NOTE_fixed='MMP writes were delayed 1.5 s for 3 s once multihost=on (inject_mmp_delay.sh, the CI stall). The fixed mmp_on_off sets zfs_multihost_fail_intervals=0, so the stall cannot suspend the pool; it checks that the pool is still ONLINE at its end, and its cleanup leaves nothing behind.'
MEM=2048
CPUS=2
TIMEOUT=900
DISKS=1
DISK_SIZE=16G
