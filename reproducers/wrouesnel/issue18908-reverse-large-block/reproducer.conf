# Reproducer wrouesnel/issue18908-reverse-large-block (docs/reproducer-format.md)
# Not a fix branch: a demo of openzfs/zfs#18908 on master.  It has only the
# repro build (no fixed-: there is no fix to compare), like selftest-triggers.
# Master refuses the receive on purpose: the refusal guards against the silent
# zeroing that 7bcb7f0840 fixed, so the expected RESULT is REFUSED, not BUG.
TITLE="zfs send -L can't reverse an incremental after a first send without -L (#18908)"
REPO='https://github.com/openzfs/zfs'
BRANCH='master'
REPORTER='@mminkus (openzfs/zfs#18908)'
PRS=''
ISSUES='18908'
# repro = openzfs/zfs master (branch head, resolved at build time)
BUILD_repro='https://github.com/openzfs/zfs@master'
CONFIGURE='--enable-debug'
EXPECT_repro='RESULT REFUSED'
EXTRACT='demo.sh'
# VM defaults
MEM=1024
CPUS=2
TIMEOUT=300
DISKS=2
DISK_SIZE=1G
