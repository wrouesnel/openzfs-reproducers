# Reproducer wrouesnel/fix-zts-raidz-boundary-repair-skip (docs/reproducer-format.md)
TITLE='ZTS: raidz_expand_boundary_repair spends most of its 20 tries where no block can straddle the reflow offset, and SKIPs now and then'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-zts-raidz-boundary-repair-skip'
AUTHOR='@wrouesnel'
REPORTER='@wrouesnel (fork CI, zfs-qemu fedora43)'
PRS=''
ISSUES=''
# a test-only (ZTS) fix, one commit on openzfs/zfs master: repro = its parent
# (master's test), fixed = the branch head
BUILD_repro='https://github.com/wrouesnel/zfs@fix-zts-raidz-boundary-repair-skip~1'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-zts-raidz-boundary-repair-skip'
CONFIGURE='--enable-debug'
# A census, not the plain test (master's test passes ~98% of runs): prep.sh
# makes raidz_expand_boundary_census.ksh from each build's own
# raidz_expand_boundary_repair.ksh (its setup and its search loop, unchanged
# but for hooks), which keeps searching until the reflow is done and records
# every stop: whether a block of the file qualifies there, and if not why.
# census.kshlib judges the build's search by its own rule: a test with a try
# budget (master: 20) fails when 8 or more of its tries can never find a
# straddling block (no block of the file at that offset, or the reflow is
# done); a test without one (the fix) passes when every stop before the
# file's end is inside the file's data and one of them qualifies.
KIND='zts'
ZTS_TESTS='tests/functional/raidz/raidz_expand_boundary_repair'
TOOLS=''
EXPECT_repro='RESULT BUG'
EXPECT_fixed='RESULT OK'
ZTS_ITERATIONS=1
ZTS_NOTE_repro='A census of master'\''s search (raidz_expand_boundary_census, made from this build'\''s raidz_expand_boundary_repair.ksh): it runs on to the end of the reflow. Master'\''s 20 tries end at its first qualifying stop; it SKIPs when none of them qualifies, as in fork CI zfs-qemu 42102468050 (7 stops in the data, none qualifying, 13 that could not).'
ZTS_NOTE_fixed='A census of the fixed search (raidz_expand_boundary_census, made from this build'\''s raidz_expand_boundary_repair.ksh): it runs on to the end of the reflow. The fixed test stops at the first qualifying stop and has no try budget.'
MEM=4096
CPUS=4
TIMEOUT=1800
DISKS=1
DISK_SIZE=16G
