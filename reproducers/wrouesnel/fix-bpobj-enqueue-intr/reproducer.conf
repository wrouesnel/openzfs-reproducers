# Reproducer wrouesnel/fix-bpobj-enqueue-intr (docs/reproducer-format.md)
# Bug #278 (openzfs/zfs#19945): dsl_dataset_block_kill(async) puts overwritten
# gang, dedup and cloned blocks on the pool's free bpobj with bpobj_enqueue()
# in the zio write-done (z_wr_int) thread, which then reads the bpobj's tail
# when it isn't cached: a stall of every write completion on that taskq, and
# a txg that never syncs with one z_wr_int thread and zfs_vdev_max_active=1.
# Since 46c4f2ce0b (#16722).
# Branch: prerequisite (dsl_scan: zfs_free_bpobj_enabled=0), test, fix.
TITLE='Overwriting cloned, dedup or gang blocks stalls the txg sync: bpobj_enqueue() reads the free bpobj in the zio write-done thread'
REPO='https://github.com/wrouesnel/zfs'
BRANCH='fix-bpobj-enqueue-intr'
AUTHOR='@wrouesnel'
REPORTER='@ahrens'
PRS=''
ISSUES='19945'
# repro = the prerequisite and the test (BRANCH~1); fixed = the head
BUILD_repro='https://github.com/wrouesnel/zfs@fix-bpobj-enqueue-intr~1'
BUILD_fixed='https://github.com/wrouesnel/zfs@fix-bpobj-enqueue-intr'
CONFIGURE='--enable-debug'
# a console demo: per kind (clone, dedup, gang) a cold free bpobj, one
# z_wr_int thread, zfs_vdev_max_active=1, an overwrite and a bounded
# zpool sync; zpool status -v after each step
EXPECT_repro='RESULT BUG: the txg sync stalled'
EXPECT_fixed='RESULT OK: the txg synced promptly for clone, dedup and gang blocks'
MEM=2048
CPUS=2
TIMEOUT=900
DISKS=1
DISK_SIZE=1G
