# Build every reproducer's container image, check that each build prints its
# expected RESULT in a VM (KVM on the runner), and on main push the images to
# ghcr.io/wrouesnel/openzfs-reproducers.  The steps are builder/build.sh's,
# so the same build runs locally.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ZFS_REPRO_IMAGE: ghcr.io/${{ github.repository_owner }}/openzfs-reproducers

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        run: |
          plan=$(builder/build.sh plan)
          echo "$plan" | python3 -m json.tool
          echo "plan=$plan" >>"$GITHUB_OUTPUT"

  # the builder image (Ubuntu at a fixed snapshot + kernel headers), once per base
  builder:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        base: ${{ fromJSON(needs.plan.outputs.plan).bases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: key
        run: echo "key=$(builder/build.sh key builder ${{ matrix.base }})" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/cache/builder-${{ matrix.base }}.tar.zst
          key: ${{ steps.key.outputs.key }}
      - run: builder/build.sh builder-load ${{ matrix.base }}

  base:
    needs: [plan, builder]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        base: ${{ fromJSON(needs.plan.outputs.plan).bases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: key
        run: |
          echo "key=$(builder/build.sh key ${{ matrix.base }})" >>"$GITHUB_OUTPUT"
          echo "bkey=$(builder/build.sh key builder ${{ matrix.base }})" >>"$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/bases/${{ matrix.base }}
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/cache/builder-${{ matrix.base }}.tar.zst
          key: ${{ steps.key.outputs.bkey }}
          fail-on-cache-miss: true
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          builder/build.sh builder-load ${{ matrix.base }}
          builder/build.sh base ${{ matrix.base }}
      - run: tar -C work -cf base-${{ matrix.base }}.tar bases/${{ matrix.base }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: base-${{ matrix.base }}
          path: base-${{ matrix.base }}.tar
          retention-days: 7

  # one OpenZFS build per (base, commit, configure), cached by commit
  zfs:
    needs: [plan, builder]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.plan).zfs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: key
        run: |
          echo "key=$(builder/build.sh key zfs ${{ matrix.base }} ${{ matrix.build }} ${{ matrix.configure }})" >>"$GITHUB_OUTPUT"
          echo "dir=$(builder/build.sh zdir ${{ matrix.base }} ${{ matrix.build }} ${{ matrix.configure }})" >>"$GITHUB_OUTPUT"
          echo "bkey=$(builder/build.sh key builder ${{ matrix.base }})" >>"$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/${{ steps.key.outputs.dir }}
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/cache/builder-${{ matrix.base }}.tar.zst
          key: ${{ steps.key.outputs.bkey }}
          fail-on-cache-miss: true
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          builder/build.sh builder-load ${{ matrix.base }}
          builder/build.sh zfs ${{ matrix.base }} ${{ matrix.build }} ${{ matrix.configure }}
      - run: tar -C work -cf zfs.tar ${{ steps.key.outputs.dir }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zfs-${{ matrix.base }}-${{ matrix.name }}-${{ strategy.job-index }}
          path: zfs.tar
          retention-days: 7

  # reproducer disks, the images, and the checks in VMs; push on main
  images:
    needs: [plan, base, zfs]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - run: |
          mkdir -p work
          find artifacts -name '*.tar' -exec tar -C work -xf {} \;
          find work -maxdepth 4 | sort
      - id: key
        run: |
          for b in $(echo '${{ needs.plan.outputs.plan }}' | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)["bases"]))'); do
            echo "bkey_$b=$(builder/build.sh key builder $b)" >>"$GITHUB_OUTPUT"
          done
      # one base so far: restore its builder image (needed by repro.sh)
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/cache/builder-linux-ubuntu24.tar.zst
          key: ${{ steps.key.outputs.bkey_linux-ubuntu24 }}
          fail-on-cache-miss: true
      - name: Reproducer disks
        run: |
          builder/build.sh builder-load linux-ubuntu24
          for id in ${{ fromJSON(needs.plan.outputs.plan).repros_str }}; do builder/build.sh repro "$id"; done
      - name: Images
        run: builder/build.sh images ${{ fromJSON(needs.plan.outputs.plan).repros_str }}
      - name: Check every build in a VM (podman run IMAGE LABEL --check)
        run: |
          rc=0
          for id in ${{ fromJSON(needs.plan.outputs.plan).repros_str }}; do
            echo "::group::$id"
            VERBOSE=1 builder/build.sh check "$id" || { rc=1; echo "::error::$id: a check failed"; }
            echo "::endgroup::"
          done
          exit $rc
      - name: Logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-logs
          path: |
            work/runs/**/*.log
            work/repros/*/SOURCES.txt
          retention-days: 14
      - name: Push to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | podman login ghcr.io -u '${{ github.actor }}' --password-stdin
          builder/build.sh push ${{ fromJSON(needs.plan.outputs.plan).repros_str }}
