# Build every reproducer for every target (the kernels openzfs/zfs CI runs),
# check each image in a VM (KVM on the runner), and on main push the pairs
# where the break reproduces and the fix passes:
#   ghcr.io/wrouesnel/openzfs-reproducers:repro-USER-SLUG-TARGET-KERNEL
#   ghcr.io/wrouesnel/openzfs-reproducers:fixed-USER-SLUG-TARGET-KERNEL
# The steps are builder/build.sh's, so the same build runs locally.  Every
# output is cached by what it is made of (builder/build.sh key ...).
# max-parallel keeps this workflow to a few runners at a time: GitHub's job
# concurrency is per account, and the account's openzfs fork CI needs it too.
# Incremental (docs/ci.md): a job runs only when its inputs (builder/build.sh
# inputs) changed since its last result on the `results` branch, at most
# MAX_JOBS per run, and none while the fork's zfs-qemu CI has runs queued.
name: build

on:
  push:
    branches: [main]
  pull_request:
  # the jobs a capped run left for later (MAX_JOBS), when the fork's CI is idle
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Rebuild and recheck every job, even those whose inputs are unchanged'
        type: boolean
        default: false
      max_jobs:
        description: 'At most this many reproducer x target jobs (ubuntu24 first; the rest wait for the next run)'
        default: '40'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ZFS_REPRO_IMAGE: ghcr.io/${{ github.repository_owner }}/openzfs-reproducers

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      has_jobs: ${{ steps.plan.outputs.has_jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The builds' commits are public
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # a reproducer whose commits aren't public (any more: a force-push)
          # is left out of this run, with a warning
          ok=
          for id in $(builder/build.sh ids); do
            if builder/build.sh verify "$id"; then ok="$ok $id"
            else echo "::warning::$id left out: its build commits are not reachable from its branch"; fi
          done
          echo "ONLY_IDS=$ok" >>"$GITHUB_ENV"
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ github.event.inputs.full == 'true' && '1' || '' }}
          MAX_JOBS: ${{ github.event.inputs.max_jobs || '40' }}
        run: |
          # the results so far (the results branch, written by the results job on main)
          git fetch -q --depth=1 origin results && git show FETCH_HEAD:results.tsv >prev-results.tsv || : >prev-results.tsv
          export PREV_RESULTS=$PWD/prev-results.tsv
          # the fork's openzfs CI comes first: no reproducer jobs while it has queued runs
          q=$(gh run list -R "${{ github.repository_owner }}/zfs" --workflow zfs-qemu.yml --status queued --json databaseId --jq length 2>/dev/null || echo unknown)
          # (when the fork's queue can't be read, assume it is busy)
          [ "$q" = unknown ] && q=99
          if [ "${q:-0}" -gt 2 ] && [ "${{ github.event_name }}" != workflow_dispatch ]; then
            echo "::notice::the fork's zfs-qemu CI has $q queued runs: no reproducer jobs this time"; MAX_JOBS=-1
          fi
          export MAX_JOBS
          plan=$(builder/build.sh plan)
          echo "$plan" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(len(d["jobs"]), "reproducer x target jobs,", len(d["zfs"]), "OpenZFS userland builds,", len(d["skipped"]), "unchanged (skipped),", len(d["deferred"]), "left for the next run"); [print(" ", j["id"], j["target"]) for j in d["jobs"]]'
          echo "plan=$plan" >>"$GITHUB_OUTPUT"
          echo "has_jobs=$(echo "$plan" | python3 -c 'import json,sys; print("yes" if json.load(sys.stdin)["jobs"] else "no")')" >>"$GITHUB_OUTPUT"

  # the shared userland and its builder (which also builds every OpenZFS userland)
  userland:
    needs: plan
    if: needs.plan.outputs.has_jobs == 'yes'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.plan).userlands }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/cache/builder-u-${{ matrix.userland }}.tar.zst
          key: ${{ matrix.builder_key }}
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/userlands/${{ matrix.userland }}
          key: ${{ matrix.userland_key }}
      - run: builder/build.sh builder-load u-${{ matrix.userland }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: builder/build.sh userland ${{ matrix.userland }}

  # a target's builder (its distribution, compiler and kernel headers) and kernel
  target:
    needs: [plan, userland]
    if: needs.plan.outputs.has_jobs == 'yes'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.plan).targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/cache/builder-${{ matrix.target }}.tar.zst
          key: ${{ matrix.builder_key }}
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/targets/${{ matrix.target }}
          key: ${{ matrix.kernel_key }}
      - run: builder/build.sh builder-load ${{ matrix.target }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/userlands/${{ matrix.userland }}
          key: ${{ fromJSON(needs.plan.outputs.plan).userlands[0].userland_key }}
          fail-on-cache-miss: true
      - if: steps.cache.outputs.cache-hit != 'true'
        run: builder/build.sh kernel ${{ matrix.target }}
      - run: cat work/targets/${{ matrix.target }}/base.conf; ls -l work/targets/${{ matrix.target }}

  # each OpenZFS userland (tools and libraries), once per commit
  zfs-user:
    needs: [plan, userland]
    if: needs.plan.outputs.has_jobs == 'yes' && toJSON(fromJSON(needs.plan.outputs.plan).zfs) != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.plan).zfs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/${{ matrix.dir }}
          key: ${{ matrix.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/cache/builder-u-${{ matrix.userland }}.tar.zst
          key: ${{ fromJSON(needs.plan.outputs.plan).userlands[0].builder_key }}
          fail-on-cache-miss: true
      - if: steps.cache.outputs.cache-hit != 'true'
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          builder/build.sh builder-load u-${{ matrix.userland }}
          builder/build.sh zfs-user ${{ matrix.userland }} ${{ matrix.build }} ${{ matrix.configure }}

  # one job per reproducer x target: the modules, the disks, the images, the
  # checks; on main, push the pair if the break reproduces and the fix passes
  repro:
    needs: [plan, target, zfs-user]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.has_jobs == 'yes' && needs.userland.result != 'failure'
    runs-on: ubuntu-24.04
    name: ${{ matrix.id }} ${{ matrix.target }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.plan).jobs }}
    env:
      ID: ${{ matrix.id }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore the builders, the userland and the target
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/cache/builder-u-${{ matrix.userland }}.tar.zst
          key: ${{ matrix.ubuilder_key }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/cache/builder-${{ matrix.target }}.tar.zst
          key: ${{ matrix.builder_key }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/userlands/${{ matrix.userland }}
          key: ${{ fromJSON(needs.plan.outputs.plan).userlands[0].userland_key }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/targets/${{ matrix.target }}
          key: ${{ matrix.kernel_key }}
          fail-on-cache-miss: true
      - name: Restore the OpenZFS userland builds
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/${{ matrix.repro.user_dir }}
          key: ${{ matrix.repro.user_key }}
          fail-on-cache-miss: true
      - if: matrix.fixed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/${{ matrix.fixed.user_dir }}
          key: ${{ matrix.fixed.user_key }}
          fail-on-cache-miss: true
      - name: Modules (cached by commit and kernel)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/${{ matrix.repro.kmod_dir }}
          key: ${{ matrix.repro.kmod_key }}
      - if: matrix.fixed
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/${{ matrix.fixed.kmod_dir }}
          key: ${{ matrix.fixed.kmod_key }}
      - name: Build
        id: build
        run: |
          builder/build.sh builder-load u-${{ matrix.userland }}
          builder/build.sh builder-load "$TARGET"
          echo "## $ID on $TARGET" >>"$GITHUB_STEP_SUMMARY"
          mkdir -p results
          if ! builder/build.sh zfs-for "$ID" "$TARGET"; then
            for l in $(builder/build.sh labels "$ID"); do
              printf '%s\t%s\t%s\tbuild-failed\t%s\t%s\t%s\n' "$ID" "$TARGET" "$l" "$(builder/build.sh tag "$ID" "$l" "$TARGET")" "the OpenZFS build failed on this kernel" "$(builder/build.sh inputs "$ID" "$TARGET")" >>results/results.tsv
            done
            echo "OpenZFS build FAILED for this kernel" >>"$GITHUB_STEP_SUMMARY"
            echo "built=no" >>"$GITHUB_OUTPUT"; exit 0
          fi
          builder/build.sh demo "$ID"
          builder/build.sh disks "$ID" "$TARGET"
          builder/build.sh images "$ID" "$TARGET"
          builder/build.sh sizes "$ID" "$TARGET"
          echo "built=yes" >>"$GITHUB_OUTPUT"
      - name: Check every image in a VM
        id: check
        if: steps.build.outputs.built == 'yes'
        run: |
          rc=0
          VERBOSE=1 RESULTS_FILE=results/results.tsv builder/build.sh check "$ID" "$TARGET" || rc=1
          cat results/results.tsv
          awk -F'\t' '{ printf "- `%s`: **%s** %s\n", $5, $4, $6 }' results/results.tsv >>"$GITHUB_STEP_SUMMARY"
          # publish only if every image passed: the break reproduces, the fix doesn't
          echo "publish=$([ $rc = 0 ] && echo yes || echo no)" >>"$GITHUB_OUTPUT"
      - name: Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.name }}
          path: |
            results/results.tsv
            work/runs/**/*.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Push to ghcr.io
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.check.outputs.publish == 'yes'
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | podman login ghcr.io -u '${{ github.actor }}' --password-stdin
          builder/build.sh push "$ID" "$TARGET"
          echo "published" >>"$GITHUB_STEP_SUMMARY"

  # the results matrix (docs/results.md is made from it), and the PR/issue alias tags
  results:
    needs: [plan, repro]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: artifacts
      - run: |
          # this run's results, plus the earlier results of the jobs it didn't
          # run (unchanged or left for later) that are still in the matrix
          find artifacts -name results.tsv -exec cat {} + | sort >new.tsv
          git fetch -q --depth=1 origin results && git show FETCH_HEAD:results.tsv >prev.tsv || : >prev.tsv
          for id in $(builder/build.sh ids); do for t in $(builder/build.sh targets "$id"); do printf '%s\t%s\n' "$id" "$t"; done; done >current.tsv
          python3 -I scripts/merge-results.py new.tsv prev.tsv current.tsv >results.tsv
          scripts/results.sh results.tsv >results.md
          cat results.md >>"$GITHUB_STEP_SUMMARY"
      - name: Record the results on the results branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir rb && cd rb && git init -q && git remote add origin "$(git -C .. remote get-url origin)"
          git -c http.extraheader="$(git -C .. config --get http.https://github.com/.extraheader)" fetch -q --depth=1 origin results && git checkout -q FETCH_HEAD || git checkout -q --orphan results
          cp ../results.tsv ../results.md .
          git add results.tsv results.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Results of run ${{ github.run_id }} (${{ github.sha }})" || exit 0
          git -c http.extraheader="$(git -C .. config --get http.https://github.com/.extraheader)" push -q origin HEAD:refs/heads/results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-matrix
          path: |
            results.tsv
            results.md
      - name: PR and issue alias tags
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | skopeo login ghcr.io -u '${{ github.actor }}' --password-stdin
          python3 -I scripts/aliases.py
