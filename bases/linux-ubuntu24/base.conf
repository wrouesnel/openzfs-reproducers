# Base linux-ubuntu24: Ubuntu 24.04 userland (busybox, bash, a few GNU tools)
# and Ubuntu's generic kernel, the platform openzfs/zfs CI calls ubuntu24.
# Read by builder/ (shell-style KEY=VALUE).
OS=Linux
# the builder container: Ubuntu 24.04 at this digest, packages from the
# Ubuntu snapshot service at SNAPSHOT, so a rebuild gets the same versions
IMAGE='docker.io/library/ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55'
SNAPSHOT='20261015T000000Z'
# kernel: linux-image/-modules/-headers-$KERNEL from that snapshot
KERNEL='6.8.0-142-generic'
