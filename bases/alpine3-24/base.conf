# Target alpine3-24: Alpine 3.24's linux-stable kernel, which openzfs CI
# "alpine3-24" boots instead of linux-virt.  Alpine keeps only the latest
# build of a package: when linux-stable moves on, update KERNEL and APKVER.
OS=Linux
ARCH=x86_64
DISTRO='Alpine Linux 3.24'
USERLAND=ubuntu24
FAMILY=alpine
IMAGE='docker.io/library/alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6'
KERNEL='7.1.5-0-stable'
APKVER='7.1.5-r0'
