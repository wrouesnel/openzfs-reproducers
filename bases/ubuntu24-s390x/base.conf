# Target ubuntu24-s390x: the big-endian target.  Ubuntu 24.04's generic
# kernel for s390x (IBM Z), the same version as ubuntu24.  openzfs/zfs CI has
# no s390x kernel job (its zfs-qemu targets are all x86_64), so this target
# is named after ubuntu24 plus the architecture.  It runs only under
# software emulation: KVM can't run an s390x guest on an x86_64 host, so the
# runtime uses qemu-system-s390x with TCG (the :runtime-s390x layer), and the
# builders run under qemu-user.  Reproducers opt in (EXTRA_TARGETS).
OS=Linux
ARCH=s390x
DISTRO='Ubuntu 24.04 (s390x)'
USERLAND=ubuntu24-s390x
FAMILY=ubuntu
IMAGE='docker.io/library/ubuntu:24.04@sha256:ed9fb832733ac3e7ca6f8bb29c369763f7f25ebff65b555990cbb88636320501'
SNAPSHOT='20261015T000000Z'
# uname -r; linux-image/-modules/-headers-$KERNEL from the snapshot (ports)
KERNEL='6.8.0-142-generic'
# the runtime: qemu and machine for this architecture (TCG only)
QEMU=qemu-system-s390x
MACHINE=s390-ccw-virtio
