# Target ubuntu24: Ubuntu 24.04's generic kernel, as openzfs/zfs CI's
# zfs-qemu job "ubuntu24" runs it.  A target is a kernel; every Linux target
# boots the shared userland (userlands/USERLAND).  Read by builder/.
OS=Linux
ARCH=x86_64
DISTRO='Ubuntu 24.04'
USERLAND=ubuntu24
# builder/Containerfile.FAMILY builds the target's OpenZFS modules and
# fetches its kernel
FAMILY=ubuntu
IMAGE='docker.io/library/ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55'
SNAPSHOT='20261015T000000Z'
# uname -r; linux-image/-modules/-headers-$KERNEL from the snapshot
KERNEL='6.8.0-142-generic'
